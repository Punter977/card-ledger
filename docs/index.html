<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0D1321;
    --surface: #161D30;
    --surface-raised: #1F2A46;
    --line: #2C3A5C;
    --text: #EBEEF8;
    --text-muted: #8B96BB;
    --accent: #A78BFA;
    --accent-dim: #4A3B78;
    --teal: #2DD4BF;
    --teal-dim: #1B5A52;
    --up: #34D399;
    --down: #FB7185;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 32px 24px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .brand span { color: var(--accent); }

  .summary {
    display: flex;
    gap: 28px;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
  }
  .summary strong { color: var(--text); font-weight: 500; }
  .summary a {
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--accent-dim);
    padding: 4px 10px;
    border-radius: 6px;
  }

  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: nowrap;
    align-items: center;
  }
  .toolbar input {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    flex: 1;
    min-width: 0;
  }
  .toolbar input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

  /* Sort control: shows only an icon when closed, but is still a real
     native <select> underneath (invisible, stretched over the icon) -
     tapping it opens the normal OS dropdown/wheel with full option text,
     just like any other select. This is purely a compact "closed" state. */
  .sort-icon-btn {
    position: relative;
    width: 42px;
    height: 39px;
    flex-shrink: 0;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 17px;
  }
  .sort-icon-btn:has(select:focus) { border-color: var(--accent); }
  .sort-icon-btn select {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: none;
    background: transparent;
    cursor: pointer;
  }

  /* ---------- compact list ---------- */
  .list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
  }
  .card-row:hover, .card-row:active { background: var(--surface-raised); }

  .row-rank {
    flex-shrink: 0;
    width: 24px;
    padding-top: 3px;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--text-muted);
  }

  .row-thumb {
    width: 48px;
    height: 66px;
    flex-shrink: 0;
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface-raised);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .row-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .row-thumb .placeholder {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 8px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.2;
  }

  .row-body { flex: 1; min-width: 0; }
  .row-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 16px;
    line-height: 1.25;
    white-space: normal;
    overflow-wrap: break-word;
  }
  .row-sub {
    font-size: 11.5px;
    color: var(--text-muted);
    white-space: normal;
    overflow-wrap: break-word;
    margin-top: 3px;
    line-height: 1.4;
  }
  .row-sub .row-grade {
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
  }

  .row-lastsale {
    font-size: 10.5px;
    color: var(--text-muted);
    opacity: 0.75;
    margin-top: 3px;
  }

  .row-price-line {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 7px;
  }
  .row-price-icon { color: var(--accent); font-size: 12px; }
  .row-value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 16px;
  }
  .row-change {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
  }
  .row-change.up { color: var(--up); }
  .row-change.down { color: var(--down); }
  .row-change.flat { color: var(--text-muted); }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-raised);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    z-index: 30;
    display: none;
  }
  .toast.visible { display: block; }
  .toast.error { border-color: var(--down); color: var(--down); }
  .toast.success { border-color: var(--teal); color: var(--teal); }

  /* ---------- detail modal ---------- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5, 7, 14, 0.7);
    z-index: 20;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.visible { display: flex; }
  @media (min-width: 640px) {
    .modal-overlay { align-items: center; }
  }

  .modal-panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    padding-bottom: 20px;
  }
  @media (min-width: 640px) {
    .modal-panel { border-radius: 16px; }
  }

  .modal-drag-handle {
    width: 36px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 10px auto 0;
  }
  @media (min-width: 640px) { .modal-drag-handle { display: none; } }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: var(--surface-raised);
    border: 1px solid var(--line);
    color: var(--text-muted);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    z-index: 1;
  }
  .modal-close:hover { color: var(--text); border-color: var(--accent-dim); }

  .modal-actions {
    position: absolute;
    top: 14px;
    left: 14px;
    display: flex;
    gap: 6px;
    z-index: 1;
  }
  .edit-link, .delete-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-muted);
    text-decoration: none;
    border: 1px solid var(--line);
    padding: 3px 8px;
    border-radius: 12px;
    background: var(--surface-raised);
    cursor: pointer;
  }
  .edit-link:hover { color: var(--accent); border-color: var(--accent-dim); }
  .delete-btn:hover { color: var(--down); border-color: var(--down); }
  .delete-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .tile-top {
    display: flex;
    gap: 14px;
    padding: 40px 20px 0;
  }

  .photo-wrap {
    width: 72px;
    height: 100px;
    flex-shrink: 0;
    border-radius: 4px;
    overflow: hidden;
    background: var(--surface-raised);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .photo-wrap a { display: block; width: 100%; height: 100%; }
  .photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-wrap .placeholder {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
  }
  .photo-wrap.clickable { cursor: pointer; }
  .photo-wrap.clickable:hover { outline: 1px solid var(--accent); }

  .id-block { flex: 1; min-width: 0; }

  .player {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 20px;
    line-height: 1.15;
    overflow-wrap: break-word;
  }
  .card-meta {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 3px;
    line-height: 1.4;
  }
  .grade-tag {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 7px;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    border-radius: 3px;
    letter-spacing: 0.3px;
  }

  .value-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 16px 20px 4px;
  }
  .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 600;
  }
  .delta { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .delta.flat { color: var(--text-muted); }
  .delta-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    align-self: flex-end;
    margin-bottom: 1px;
  }

  .chart-wrap { padding: 4px 16px 8px; height: 96px; position: relative; }
  .chart-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 0 20px 2px;
  }
  .chart-empty {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    padding: 20px 4px;
  }

  .comps {
    border-top: 1px solid var(--line);
    padding: 10px 20px 4px;
    font-size: 12.5px;
  }
  .comps summary {
    cursor: pointer;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    list-style: none;
  }
  .comps summary::-webkit-details-marker { display: none; }
  .comps summary:before { content: "▸ "; }
  .comps[open] summary:before { content: "▾ "; }
  .comp-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 0;
    border-top: 1px solid var(--line);
  }
  .comp-row:first-of-type { margin-top: 8px; }
  .comp-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .comp-title {
    color: var(--text-muted);
    overflow-wrap: break-word;
    white-space: normal;
  }
  .comp-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-muted);
    opacity: 0.7;
  }
  .comp-price { font-family: 'JetBrains Mono', monospace; color: var(--text); flex-shrink: 0; padding-top: 1px; }
  .comp-title a, .comp-price a { color: inherit; text-decoration: none; }
  .comp-title a:hover, .comp-price a:hover { text-decoration: underline; }
  .manual-tag {
    color: var(--teal);
    font-size: 9.5px;
    border: 1px solid var(--teal-dim);
    padding: 0 4px;
    border-radius: 3px;
    margin-left: 5px;
  }

  .add-comp-row { margin-top: 10px; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-muted);
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  button.secondary:hover { border-color: var(--accent); color: var(--accent); }
  button.secondary.small { width: auto; padding: 6px 10px; font-size: 11.5px; }
  button.secondary:disabled { opacity: 0.5; cursor: not-allowed; }

  .add-comp-form {
    margin-top: 10px;
    display: none;
    flex-direction: column;
    gap: 6px;
  }
  .add-comp-form.visible { display: flex; }
  .add-comp-form input {
    background: var(--surface-raised);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 7px 9px;
    border-radius: 5px;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    width: 100%;
  }
  .add-comp-form input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .field-row-inline { display: flex; gap: 6px; }
  .field-row-inline input { flex: 1; }
  .add-comp-hint { font-size: 11px; color: var(--text-muted); }

  .tree {
    padding: 2px 20px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
  }
  .tree-group {
    margin-top: 8px;
  }
  .tree-group-label {
    color: var(--text-muted);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 3px;
  }
  .tree-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 0 2px 14px;
    position: relative;
    color: var(--text-muted);
  }
  .tree-item::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 0;
    bottom: 50%;
    width: 8px;
    border-left: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .tree-item.has-sale { color: var(--text); }
  .tree-item.has-sale .tree-price { color: var(--accent); font-weight: 600; }
  .tree-item.is-own {
    color: var(--teal);
    font-weight: 600;
  }
  .tree-item.is-own::before { border-color: var(--teal-dim); }
  .tree-label { min-width: 26px; }
  .tree-price { margin-left: auto; }
  .tree-own-tag {
    font-size: 9px;
    border: 1px solid var(--teal-dim);
    color: var(--teal);
    padding: 0 4px;
    border-radius: 3px;
    text-transform: uppercase;
  }
  .tree-item.clickable { cursor: pointer; }
  .tree-item.clickable:hover { color: var(--accent); }
  .tree-item.active-filter {
    background: rgba(167, 139, 250, 0.1);
    border-radius: 4px;
    color: var(--accent);
  }
  .tree-item.active-filter .tree-price { color: var(--accent); }

  .comps-filter-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: var(--text-muted);
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
    margin: 8px 0;
  }
  .comps-filter-bar strong { color: var(--accent); }
  .clear-filter-btn {
    margin-left: auto;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
  }
  .clear-filter-btn:hover { color: var(--down); }
</style>
</head>
<body>

<header>
  <div class="brand">CARD <span>LEDGER</span></div>
  <div class="summary" id="summary-stats">
    <div>TOTAL <strong id="stat-total">—</strong></div>
    <div>CARDS <strong id="stat-count">—</strong></div>
    <div>UPDATED <strong id="stat-updated">—</strong></div>
    <a href="add.html">+ ADD CARD</a>
  </div>
</header>

<main>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search player, set, year…">
    <div class="sort-icon-btn" title="Sort">
      <span aria-hidden="true">⇅</span>
      <select id="sort">
        <option value="value-desc">Value: High to Low</option>
        <option value="value-asc">Value: Low to High</option>
        <option value="change-desc">Change: Biggest Gain</option>
        <option value="change-asc">Change: Biggest Drop</option>
        <option value="last-sale-desc">Recent Sale</option>
        <option value="added-desc">Recently Added</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
  </div>

  <div class="list" id="grid"></div>
  <div class="empty-state" id="empty" style="display:none;">No cards match your search.</div>
</main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-panel" id="modal-panel"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const PHOTOS_PATH = 'photos/';
const DATA_PATH = 'data/price_history.json';
// Repo-relative paths (from the root, not from docs/) for GitHub API writes.
const DATA_PATH_REPO = 'docs/data/price_history.json';
const CSV_PATH_REPO = 'docs/data/cards.csv';
const SETTINGS_KEY = 'card_ledger_settings_v1'; // shared with add.html

let cardsData = [];
let rawHistory = {};
let activeChart = null; // the one Chart.js instance backing whichever modal is open

function fmtMoney(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return '$' + Number(n).toFixed(2);
}
function fmtMoneyShort(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return '$' + Math.round(Number(n)).toLocaleString();
}

// Our own data always stores dates as YYYY-MM-DD - display as dd/mm/yy.
function fmtDateDMY(iso) {
  if (!iso) return '';
  const parts = iso.split('-');
  if (parts.length !== 3) return iso;
  const [y, m, d] = parts;
  return `${d}/${m}/${y.slice(2)}`;
}

function showToast(kind, msg) {
  const el = document.getElementById('toast');
  el.className = `toast visible ${kind}`;
  el.textContent = msg;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('visible'), 4000);
}

// ---------- GitHub write helpers (shared settings with add.html) ----------
function getSettings() {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); } catch { return {}; }
}
function hasGithubConnection() {
  const s = getSettings();
  return !!(s.owner && s.repo && s.token);
}
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function base64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
async function ghFetch(path, options = {}) {
  const s = getSettings();
  const url = `https://api.github.com/repos/${s.owner}/${s.repo}/contents/${path}`;
  return fetch(url, {
    ...options,
    headers: {
      'Authorization': `Bearer ${s.token}`,
      'Accept': 'application/vnd.github+json',
      ...(options.headers || {}),
    },
  });
}
async function ghApiFetch(apiPath) {
  const s = getSettings();
  const url = `https://api.github.com/repos/${s.owner}/${s.repo}/${apiPath}`;
  return fetch(url, {
    headers: { 'Authorization': `Bearer ${s.token}`, 'Accept': 'application/vnd.github+json' },
  });
}
async function getExistingFile(path) {
  const res = await ghFetch(path);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`Couldn't read ${path} (${res.status}). Check your token's permissions.`);
  const data = await res.json();
  if (data.content) return data; // small file - Contents API included it inline

  // GitHub's Contents API omits `content` for files over 1MB. As
  // price_history.json accumulates daily snapshots across many cards, it
  // can grow past that threshold - fall back to the Git Blobs API, which
  // handles files up to 100MB, using the sha we already have.
  const blobRes = await ghApiFetch(`git/blobs/${data.sha}`);
  if (!blobRes.ok) throw new Error(`Couldn't read ${path} via the blobs API (${blobRes.status}) - it may have grown too large.`);
  const blob = await blobRes.json();
  return { ...data, content: blob.content };
}
async function putFile(path, base64Content, message, sha) {
  const s = getSettings();
  const body = { message, content: base64Content, branch: s.branch || 'main' };
  if (sha) body.sha = sha;
  const res = await ghFetch(path, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(`Failed to write ${path} (${res.status}): ${err.message || 'unknown error'}`);
  }
  return res.json();
}

// Minimal CSV parse/serialize (handles quoted fields) - needed here only
// for deleting a row out of cards.csv when a card is deleted.
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (rows.length && rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') rows.pop();
  const header = rows.length ? rows[0] : [];
  const dataRows = rows.slice(1).map(r => {
    const obj = {};
    header.forEach((col, i) => { obj[col.trim()] = r[i] ?? ''; });
    return obj;
  });
  return { header: header.map(h => h.trim()), rows: dataRows };
}
function csvEscape(v) {
  v = (v ?? '').toString();
  if (/[",\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
  return v;
}
function serializeCSV(header, rows) {
  const lines = [header.join(',')];
  for (const row of rows) lines.push(header.map(col => csvEscape(row[col] ?? '')).join(','));
  return lines.join('\n') + '\n';
}

// Labels the highest and lowest points directly on the modal's sparkline,
// since the axes themselves are hidden (too small a chart to spare the
// space) and a legend would be overkill for a single line.
const highLowLabelPlugin = {
  id: 'highLowLabel',
  afterDatasetsDraw(chart) {
    const data = chart.data.datasets[0]?.data;
    if (!data) return;
    const meta = chart.getDatasetMeta(0);

    let maxIdx = -1, minIdx = -1, maxVal = -Infinity, minVal = Infinity;
    data.forEach((v, i) => {
      if (v === null || v === undefined) return;
      if (v > maxVal) { maxVal = v; maxIdx = i; }
      if (v < minVal) { minVal = v; minIdx = i; }
    });
    if (maxIdx === -1) return;

    const { ctx } = chart;
    ctx.save();
    ctx.font = "9px 'JetBrains Mono', monospace";
    ctx.textAlign = 'center';

    const drawLabel = (idx, val, color, above) => {
      const point = meta.data[idx];
      if (!point) return;
      ctx.fillStyle = color;
      ctx.textBaseline = above ? 'bottom' : 'top';
      ctx.fillText(fmtMoneyShort(val), point.x, point.y + (above ? -5 : 6));
    };

    drawLabel(maxIdx, maxVal, '#34D399', true);
    if (minIdx !== maxIdx) drawLabel(minIdx, minVal, '#FB7185', false);

    ctx.restore();
  }
};
Chart.register(highLowLabelPlugin);

function pctChange(first, last) {
  if (!first || !last || first === 0) return null;
  return ((last - first) / first) * 100;
}

function median(nums) {
  const sorted = [...nums].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

// Splits a grade string like "BGS 8.5" into ["BGS", "8.5"], or [null, null]
// if blank (raw card) - mirrors fetch_prices.py's parse_grade_string.
function parseGradeString(gradeStr) {
  const s = (gradeStr || '').trim();
  if (!s) return [null, null];
  const parts = s.split(/\s+/);
  if (parts.length < 2) return [null, null];
  return [parts[0].toUpperCase(), parts[1]];
}

// Splits a pooled-sale "label" (e.g. "Raw", "PSA 9") into a company key
// and a grade value (null for Raw) for tree grouping.
function parseLabel(label) {
  const s = (label || 'Raw').trim();
  if (/^raw$/i.test(s)) return { company: 'Raw', grade: null };
  const parts = s.split(/\s+/);
  if (parts.length >= 2) return { company: parts[0].toUpperCase(), grade: parts.slice(1).join(' ') };
  if (/^\d+(\.\d)?$/.test(s)) return { company: 'Graded (unspecified)', grade: s };
  return { company: s.toUpperCase(), grade: null };
}

// Pools every confirmed sale collected across all stored snapshots (raw +
// every grade queried, from every day fetch_prices.py has run) PLUS any
// manually-added comps, dedupes by listing URL - since the free tier's
// 3-day lookback means the same sale can legitimately show up in several
// consecutive days' pulls. This is the single source of truth for the
// trend line, the grade-breakdown tree, and the "Recent comps" list.
function poolDedupedSales(snapshots, manualComps) {
  const seen = new Set();
  const all = [];
  const addSale = (sale, source) => {
    if (sale.price === null || sale.price === undefined || !sale.date) return;
    const key = sale.url || `${sale.date}-${sale.price}-${sale.label}-${source}`;
    if (seen.has(key)) return;
    seen.add(key);
    all.push({
      price: sale.price, date: sale.date, url: sale.url || '',
      title: sale.title || '', label: sale.label || 'Raw', source,
    });
  };
  for (const snap of snapshots) {
    for (const sale of (snap.pooled_sales || [])) addSale(sale, 'api');
  }
  for (const mc of (manualComps || [])) addSale(mc, 'manual');
  all.sort((a, b) => a.date.localeCompare(b.date));
  return all;
}

// Computes a 30-day trailing average as of each snapshot date, from the
// deduped sale pool above. This gives vintage/thinly-traded cards a
// usable trend line even when their exact grade rarely has a sale in any
// single 3-day window.
function computeRollingAverage(snapshots, allSales) {
  const WINDOW_DAYS = 30;
  return snapshots.map(snap => {
    const asOf = new Date(snap.date);
    const windowStart = new Date(asOf);
    windowStart.setDate(windowStart.getDate() - WINDOW_DAYS);
    const inWindow = allSales.filter(s => {
      const d = new Date(s.date);
      return d >= windowStart && d <= asOf;
    });
    if (!inWindow.length) return null;
    const avg = inWindow.reduce((sum, s) => sum + s.price, 0) / inWindow.length;
    return Math.round(avg * 100) / 100;
  });
}

// Rebuilds the Raw/company/grade breakdown entirely from the accumulated,
// deduped sale pool (API history + manual comps combined) rather than
// relying on a single day's server-computed tree. This means the tree
// reflects your FULL accumulated history, not just the latest 3-day pull -
// and it updates the moment you add a manual comp, with no need to wait
// for the next scheduled run.
function buildLiveTree(allSales, grader, grade) {
  const groups = {}; // company -> { gradeKey: sales[] }  (gradeKey '__raw__' for Raw)
  for (const sale of allSales) {
    const { company, grade: gVal } = parseLabel(sale.label);
    const gradeKey = gVal === null ? '__raw__' : gVal;
    groups[company] = groups[company] || {};
    groups[company][gradeKey] = groups[company][gradeKey] || [];
    groups[company][gradeKey].push(sale);
  }

  const ownCompany = grader || 'Raw';
  const ownGradeKey = grader ? grade : '__raw__';
  groups[ownCompany] = groups[ownCompany] || {};
  groups[ownCompany][ownGradeKey] = groups[ownCompany][ownGradeKey] || [];

  const companies = Object.keys(groups).sort((a, b) => {
    if (a === 'Raw') return -1;
    if (b === 'Raw') return 1;
    return a.localeCompare(b);
  });

  const tree = [];
  let ownValue = null, ownSampleSize = 0;

  for (const company of companies) {
    const gradeKeys = Object.keys(groups[company]).sort((a, b) => {
      if (a === '__raw__') return -1;
      if (b === '__raw__') return 1;
      return parseFloat(b) - parseFloat(a);
    });
    const items = [];
    for (const gk of gradeKeys) {
      const sales = groups[company][gk];
      const prices = sales.map(s => s.price);
      const value = prices.length ? Math.round(median(prices) * 100) / 100 : null;
      const label = gk === '__raw__' ? 'Raw' : gk;
      const isOwn = (company === ownCompany && gk === ownGradeKey);
      const comps = sales.slice(-2).reverse().map(s => ({ price: s.price, date: s.date, title: s.title, url: s.url }));
      const fullSales = sales.slice().reverse().map(s => ({ price: s.price, date: s.date, title: s.title, url: s.url, source: s.source }));
      items.push({ label, value, sample_size: sales.length, comps, allSales: fullSales, is_own: isOwn });
      if (isOwn) { ownValue = value; ownSampleSize = sales.length; }
    }
    tree.push({ group: company, items });
  }

  return { tree, ownValue, ownSampleSize };
}

function buildCardObjects(history) {
  return Object.entries(history).map(([id, entry]) => {
    const snaps = (entry.snapshots || []).slice().sort((a, b) => a.date.localeCompare(b.date));
    const manualComps = entry.manual_comps || [];
    const meta = entry.meta || {};
    const allSales = poolDedupedSales(snaps, manualComps);
    const rollingAvg = computeRollingAverage(snaps, allSales);

    const [grader, grade] = parseGradeString(meta.grade);
    const { tree, ownValue, ownSampleSize } = buildLiveTree(allSales, grader, grade);

    const asOfLatest = snaps.length ? new Date(snaps[snaps.length - 1].date)
      : (allSales.length ? new Date(allSales[allSales.length - 1].date) : null);
    let salesLast30 = 0;
    if (asOfLatest) {
      const windowStart = new Date(asOfLatest);
      windowStart.setDate(windowStart.getDate() - 30);
      salesLast30 = allSales.filter(s => {
        const d = new Date(s.date);
        return d >= windowStart && d <= asOfLatest;
      }).length;
    }

    const firstAvg = rollingAvg.find(v => v !== null);
    const lastAvg = [...rollingAvg].reverse().find(v => v !== null);
    const change = (firstAvg !== undefined && lastAvg !== undefined) ? pctChange(firstAvg, lastAvg) : null;

    const recentComps = allSales.slice(-8).reverse();
    const lastSaleDate = allSales.length ? allSales[allSales.length - 1].date : null;

    return {
      id, meta, snapshots: snaps, manualComps,
      latestValue: ownValue,
      change, comps: recentComps, tree, rollingAvg, salesLast30, lastSaleDate,
    };
  });
}

function renderSummary(cards) {
  const total = cards.reduce((sum, c) => sum + (Number(c.latestValue) || 0), 0);
  document.getElementById('stat-total').textContent = fmtMoney(total);
  document.getElementById('stat-count').textContent = cards.length;
  const dates = cards.flatMap(c => c.snapshots.map(s => s.date));
  document.getElementById('stat-updated').textContent = dates.length ? dates.sort().pop() : '—';
}

// ---------- compact list row ----------
function cardRow(card, rank) {
  const m = card.meta;
  const title = m.player || 'Unknown Player';
  const metaLine = [m.year, m.set, m.variant].filter(Boolean).join(' · ') +
    (m.card_number ? ` #${m.card_number}` : '');

  const changeClass = card.change === null ? 'flat' : card.change > 0 ? 'up' : card.change < 0 ? 'down' : 'flat';
  const changeSign = card.change > 0 ? '+' : '';
  const changeText = card.change === null ? '—' : `${changeSign}${card.change.toFixed(1)}%`;

  const hasPhoto = !!m.photo_filename;
  const thumbInner = hasPhoto
    ? `<img src="${PHOTOS_PATH}${m.photo_filename}" alt="${title}" loading="lazy" onerror="this.closest('.row-thumb').innerHTML='<div class=placeholder>No<br>photo</div>'">`
    : `<div class="placeholder">No<br>photo</div>`;

  const subParts = [];
  if (m.grade) subParts.push(`<span class="row-grade">${m.grade}</span>`);
  subParts.push(metaLine || '—');

  return `
    <div class="card-row" data-card-id="${card.id}" data-search="${(title + ' ' + metaLine).toLowerCase()}">
      <div class="row-rank">#${rank}</div>
      <div class="row-thumb">${thumbInner}</div>
      <div class="row-body">
        <div class="row-title">${title}</div>
        <div class="row-sub">${subParts.join(' · ')}</div>
        ${card.lastSaleDate ? `<div class="row-lastsale">last sale ${fmtDateDMY(card.lastSaleDate)}</div>` : ''}
        <div class="row-price-line">
          <span class="row-price-icon">››</span>
          <span class="row-value">${fmtMoney(card.latestValue)}</span>
          <span class="row-change ${changeClass}">${changeText}</span>
        </div>
      </div>
    </div>
  `;
}

function renderList(cards) {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');

  if (!cards.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = cards.map((c, i) => cardRow(c, i + 1)).join('');
}

// ---------- detail modal ----------
function modalContent(card) {
  modalTreeSalesIndex = {}; // rebuilt fresh on every render (tree-item clicks reference this by key)
  const m = card.meta;
  const title = m.player || 'Unknown Player';
  const metaLine = [m.year, m.set, m.variant].filter(Boolean).join(' · ') +
    (m.card_number ? ` #${m.card_number}` : '');

  const changeClass = card.change === null ? 'flat' : card.change > 0 ? 'up' : card.change < 0 ? 'down' : 'flat';
  const changeSign = card.change > 0 ? '+' : '';

            const clickable = item.value !== null && item.allSales && item.allSales.length > 0;

            return `

      <div class="photo-wrap ${hasPhoto ? 'clickable' : ''}">${photoHtml}</div>

    <div class="value-row">

    </div>
    <details class="comps" open>
      <summary>Recent comps</summary>

        <input type="text" class="mc-url" placeholder="eBay link (optional)">

          <button class="secondary small" data-action="save-comp">Save</button>
          <button class="secondary small" data-action="cancel-comp">Cancel</button>
        </div>

}

function drawModalChart(card) {
  if (activeChart) { activeChart.destroy(); activeChart = null; }
  const canvas = document.getElementById('modal-chart');
  if (!canvas || card.snapshots.length < 1) return;

  const labels = card.snapshots.map(s => s.date);
  const values = card.rollingAvg;
  if (!values.some(v => v !== null)) return;

  const firstVal = values.find(v => v !== null);
  const lastVal = [...values].reverse().find(v => v !== null);
  const isUp = lastVal === undefined || firstVal === undefined || lastVal >= firstVal;

  activeChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: isUp ? '#34D399' : '#FB7185',
        backgroundColor: isUp ? 'rgba(52,211,153,0.08)' : 'rgba(251,113,133,0.08)',
        borderWidth: 1.75,
        pointRadius: 0,
        tension: 0.3,
        fill: true,
        spanGaps: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 12, bottom: 12 } },
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: (ctx) => ctx.parsed.y === null ? 'no sales in window' : fmtMoney(ctx.parsed.y) }
      }},
      scales: { x: { display: false }, y: { display: false } },
      elements: { line: { capBezierPoints: true } },
    }
  });
}

let openCardId = null;
let modalTreeSalesIndex = {}; // reset each time the modal opens - tree-item key -> {label, sales}

function renderCompRows(sales) {
  if (!sales || !sales.length) return `<div class="comp-row"><span class="comp-title">No recent comps</span></div>`;
  return sales.map(c => `
    <div class="comp-row">
      <div class="comp-main">
        <span class="comp-title" title="${c.title || ''}">${c.url ? `<a href="${c.url}" target="_blank" rel="noopener">${c.title || 'Sale'}</a>` : (c.title || 'Sale')}${c.source === 'manual' ? '<span class="manual-tag">manual</span>' : ''}</span>
        <span class="comp-date">${c.date ? fmtDateDMY(c.date) : ''}</span>
      </div>
      <span class="comp-price">${fmtMoney(c.price)}</span>
    </div>`).join('');
}

function openModal(cardId) {
  const card = cardsData.find(c => c.id === cardId);
  if (!card) return;
  openCardId = cardId;
  document.getElementById('modal-panel').innerHTML = modalContent(card);
  document.getElementById('modal-overlay').classList.add('visible');
  drawModalChart(card);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('visible');
  document.getElementById('modal-panel').innerHTML = '';
  if (activeChart) { activeChart.destroy(); activeChart = null; }
  openCardId = null;
}

// Refreshes the open modal in place after a data change (comp added,
// etc.) without closing and reopening it.
function refreshModalIfOpen() {
  if (openCardId) openModal(openCardId);
}

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});

function applyFiltersAndSort() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const sortBy = document.getElementById('sort').value;

  let filtered = cardsData.filter(c => {
    const hay = (c.meta.player + ' ' + c.meta.set + ' ' + c.meta.year).toLowerCase();
    return hay.includes(q);
  });

  filtered.sort((a, b) => {
    switch (sortBy) {
      case 'value-desc': return (b.latestValue || 0) - (a.latestValue || 0);
      case 'value-asc': return (a.latestValue || 0) - (b.latestValue || 0);
      case 'change-desc': return (b.change ?? -999) - (a.change ?? -999);
      case 'change-asc': return (a.change ?? 999) - (b.change ?? 999);
      case 'last-sale-desc': return (b.lastSaleDate || '').localeCompare(a.lastSaleDate || '');
      case 'added-desc': return (b.meta.added_at || '').localeCompare(a.meta.added_at || '');
      case 'name': return (a.meta.player || '').localeCompare(b.meta.player || '');
      default: return 0;
    }
  });

  renderList(filtered);
}

async function init() {
  try {
    // Cache-bust every load: GitHub Pages sits behind a CDN, and browsers
    // cache fetch() responses too, so without a unique query string a
    // reload can keep serving a stale copy of price_history.json for
    // minutes after a real change (delete, edit, price pull) has landed.
    const res = await fetch(`${DATA_PATH}?t=${Date.now()}`);
    if (!res.ok) throw new Error('history file not found');
    rawHistory = await res.json();
    cardsData = buildCardObjects(rawHistory);
    renderSummary(cardsData);
    applyFiltersAndSort();
  } catch (err) {
    document.getElementById('grid').innerHTML = '';
    document.getElementById('empty').style.display = 'block';
    document.getElementById('empty').textContent =
      'No price data yet. Run fetch_prices.py to generate data/price_history.json.';
    console.error(err);
  }
}

// ---------- list click: open a card's detail modal ----------
document.getElementById('grid').addEventListener('click', (e) => {
  const row = e.target.closest('.card-row');
  if (!row) return;
  openModal(row.dataset.cardId);
});

// ---------- modal click: close / add-comp / delete (event delegation,
// since the modal's innerHTML gets replaced wholesale on every open) ----------
document.getElementById('modal-panel').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === 'close-modal') {
    closeModal();
  } else if (action === 'search-130point') {
    await handleSearch130point(btn);
  } else if (action === 'filter-comps') {
    handleFilterComps(btn);
  } else if (action === 'clear-comps-filter') {
    handleClearCompsFilter();
  } else if (action === 'show-add-comp') {
    document.querySelector('#modal-panel .add-comp-form').classList.add('visible');
    btn.style.display = 'none';
  } else if (action === 'cancel-comp') {
    document.querySelector('#modal-panel .add-comp-form').classList.remove('visible');
    document.querySelector('#modal-panel [data-action="show-add-comp"]').style.display = '';
  } else if (action === 'save-comp') {
    await handleSaveComp(btn, openCardId);
  } else if (action === 'delete-card') {
    await handleDeleteCard(btn, btn.dataset.cardId);
  }
});

// Tapping a tree item (e.g. "PSA 9") filters the comps list below to only
// that grade's sales, reusing the exact same grouped sales the tree cell
// itself was computed from - so what you see filtered always matches
// what the tree displayed for that cell.
function handleFilterComps(btn) {
  const key = btn.dataset.treeKey;
  const entry = modalTreeSalesIndex[key];
  if (!entry) return;

  document.querySelectorAll('#modal-panel .tree-item.active-filter').forEach(el => el.classList.remove('active-filter'));
  btn.classList.add('active-filter');

  document.getElementById('modal-comps-list').innerHTML = renderCompRows(entry.sales);
  document.getElementById('modal-comps-filter').innerHTML = `
    <div class="comps-filter-bar">
      Showing <strong>${entry.label}</strong> (${entry.sales.length})
      <button class="clear-filter-btn" data-action="clear-comps-filter">× clear</button>
    </div>`;
}

function handleClearCompsFilter() {
  const card = cardsData.find(c => c.id === openCardId);
  if (!card) return;
  document.querySelectorAll('#modal-panel .tree-item.active-filter').forEach(el => el.classList.remove('active-filter'));
  document.getElementById('modal-comps-list').innerHTML = renderCompRows(card.comps);
  document.getElementById('modal-comps-filter').innerHTML = '';
}

// 130point's search box is entirely JavaScript-driven with no shareable
// URL, so there's no query parameter to pre-fill via a link. The next
// best thing: copy the search text to the clipboard and open the site,
// so it's a one-paste action instead of retyping the card's details.
async function handleSearch130point(btn) {
  const query = btn.dataset.query || '';
  try {
    await navigator.clipboard.writeText(query);
    showToast('success', `Copied "${query}" — paste it into 130point's search box.`);
  } catch (err) {
    // Clipboard access can be blocked (e.g. non-HTTPS context, permission
    // denied) - fall back to just telling them what to type themselves.
    showToast('error', `Couldn't copy automatically — search for "${query}" on 130point.`);
  }
  window.open('https://130point.com/sales/', '_blank', 'noopener');
}

async function handleSaveComp(btn, cardId) {
  if (!hasGithubConnection()) {
    showToast('error', 'Connect GitHub first — open the Add Card page and fill in the connection settings.');
    return;
  }
  const panel = document.getElementById('modal-panel');
  const price = parseFloat(panel.querySelector('.mc-price').value);
  const date = panel.querySelector('.mc-date').value.trim();
  const label = panel.querySelector('.mc-label').value.trim() || 'Raw';
  const compTitle = panel.querySelector('.mc-title').value.trim();
  const url = panel.querySelector('.mc-url').value.trim();

  if (!price || isNaN(price)) { showToast('error', 'Enter a valid price.'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { showToast('error', 'Date must be in YYYY-MM-DD format.'); return; }
  if (!/^raw$/i.test(label) && /^\d+(\.\d)?$/.test(label)) {
    showToast('error', `"${label}" needs a grading company — try "PSA ${label}" or "BGS ${label}".`);
    return;
  }

  btn.disabled = true;
  try {
    const existing = await getExistingFile(DATA_PATH_REPO);
    const freshHistory = existing ? JSON.parse(base64ToUtf8(existing.content)) : {};
    const entry = freshHistory[cardId] || { meta: {}, snapshots: [] };
    entry.manual_comps = entry.manual_comps || [];
    entry.manual_comps.push({
      price, date, label, title: compTitle, url,
      source: 'manual', added_at: new Date().toISOString(),
    });
    freshHistory[cardId] = entry;

    await putFile(DATA_PATH_REPO, utf8ToBase64(JSON.stringify(freshHistory, null, 2)),
      `Add manual comp: ${cardId}`, existing ? existing.sha : undefined);

    rawHistory = freshHistory;
    cardsData = buildCardObjects(rawHistory);
    renderSummary(cardsData);
    applyFiltersAndSort();
    refreshModalIfOpen();
    showToast('success', 'Comp added.');
  } catch (err) {
    showToast('error', err.message || 'Failed to save comp.');
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}

async function handleDeleteCard(btn, cardId) {
  const label = btn.dataset.label || 'this card';
  if (!confirm(`Delete ${label}? This removes it from your CSV and price history. Photos are left in place.`)) return;

  if (!hasGithubConnection()) {
    showToast('error', 'Connect GitHub first — open the Add Card page and fill in the connection settings.');
    return;
  }

  btn.disabled = true;
  try {
    const card = cardsData.find(c => c.id === cardId);
    const m = card ? card.meta : {};

    const csvExisting = await getExistingFile(CSV_PATH_REPO);
    if (csvExisting) {
      const text = base64ToUtf8(csvExisting.content);
      const { header, rows } = parseCSV(text);
      const idx = rows.findIndex(r =>
        (r.player || '').trim() === (m.player || '').trim() &&
        (r.year || '').trim() === (m.year || '').trim() &&
        (r.set || '').trim() === (m.set || '').trim() &&
        (r.card_number || '').trim() === (m.card_number || '').trim() &&
        (r.grade || '').trim() === (m.grade || '').trim()
      );
      if (idx !== -1) {
        rows.splice(idx, 1);
        await putFile(CSV_PATH_REPO, utf8ToBase64(serializeCSV(header, rows)), `Delete card: ${label}`, csvExisting.sha);
      }
    }

    const histExisting = await getExistingFile(DATA_PATH_REPO);
    if (histExisting) {
      const freshHistory = JSON.parse(base64ToUtf8(histExisting.content));
      delete freshHistory[cardId];
      await putFile(DATA_PATH_REPO, utf8ToBase64(JSON.stringify(freshHistory, null, 2)), `Delete card history: ${label}`, histExisting.sha);
      rawHistory = freshHistory;
    } else {
      delete rawHistory[cardId];
    }

    cardsData = buildCardObjects(rawHistory);
    renderSummary(cardsData);
    applyFiltersAndSort();
    closeModal();
    showToast('success', `${label} deleted.`);
  } catch (err) {
    showToast('error', err.message || 'Failed to delete card.');
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('search').addEventListener('input', applyFiltersAndSort);
document.getElementById('sort').addEventListener('change', applyFiltersAndSort);

init();
</script>
