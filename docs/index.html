<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0B0E14;
    --surface: #131722;
    --surface-raised: #1A2030;
    --line: #262D3F;
    --text: #E7EAF2;
    --text-muted: #8B93A6;
    --gold: #E8A33D;
    --gold-dim: #6B5426;
    --up: #4ADE80;
    --down: #F87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 32px 24px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .brand span { color: var(--gold); }

  .summary {
    display: flex;
    gap: 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
  }
  .summary strong { color: var(--text); font-weight: 500; }

  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .toolbar input {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    flex: 1;
    min-width: 200px;
  }
  .toolbar input:focus { outline: 1px solid var(--gold); border-color: var(--gold); }
  .toolbar select {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }

  .tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .tile-top {
    display: flex;
    gap: 14px;
    padding: 16px 16px 0;
  }

  .photo-wrap {
    width: 64px;
    height: 90px;
    flex-shrink: 0;
    border-radius: 4px;
    overflow: hidden;
    background: var(--surface-raised);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .photo-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .photo-wrap .placeholder {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
  }

  .id-block { flex: 1; min-width: 0; }

  .player {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 19px;
    line-height: 1.15;
    overflow-wrap: break-word;
  }
  .card-meta {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 3px;
    line-height: 1.4;
  }
  .grade-tag {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 7px;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    border-radius: 3px;
    letter-spacing: 0.3px;
  }

  .value-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 14px 16px 4px;
  }
  .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    font-weight: 600;
  }
  .delta { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .delta.flat { color: var(--text-muted); }

  .chart-wrap { padding: 4px 12px 8px; height: 80px; }

  .comps {
    border-top: 1px solid var(--line);
    padding: 10px 16px 14px;
    font-size: 12.5px;
  }
  .comps summary {
    cursor: pointer;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    list-style: none;
  }
  .comps summary::-webkit-details-marker { display: none; }
  .comps summary:before { content: "▸ "; }
  .comps[open] summary:before { content: "▾ "; }
  .comp-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 0;
    border-top: 1px solid var(--line);
  }
  .comp-row:first-of-type { margin-top: 8px; }
  .comp-title {
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .comp-price { font-family: 'JetBrains Mono', monospace; color: var(--text); flex-shrink: 0; }

  .context-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 0 16px 12px;
  }
  .context-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    padding: 3px 8px;
    border-radius: 12px;
    border: 1px solid var(--line);
    color: var(--text-muted);
    white-space: nowrap;
  }
  .context-chip.has-sale {
    border-color: var(--gold-dim);
    color: var(--gold);
  }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">CARD <span>LEDGER</span></div>
  <div class="summary" id="summary-stats">
    <div>TOTAL <strong id="stat-total">—</strong></div>
    <div>CARDS <strong id="stat-count">—</strong></div>
    <div>UPDATED <strong id="stat-updated">—</strong></div>
  </div>
</header>

<main>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search player, set, year…">
    <select id="sort">
      <option value="value-desc">Value: High to Low</option>
      <option value="value-asc">Value: Low to High</option>
      <option value="change-desc">Change: Biggest Gain</option>
      <option value="change-asc">Change: Biggest Drop</option>
      <option value="name">Name A–Z</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty-state" id="empty" style="display:none;">No cards match your search.</div>
</main>

<script>
const PHOTOS_PATH = '../photos/';
const DATA_PATH = '../data/price_history.json';

let cardsData = [];

function fmtMoney(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return '$' + Number(n).toFixed(2);
}

function pctChange(first, last) {
  if (!first || !last || first === 0) return null;
  return ((last - first) / first) * 100;
}

function buildCardObjects(history) {
  return Object.entries(history).map(([id, entry]) => {
    const snaps = (entry.snapshots || []).slice().sort((a, b) => a.date.localeCompare(b.date));
    const latest = snaps[snaps.length - 1];
    const first = snaps[0];
    const change = latest && first ? pctChange(first.value, latest.value) : null;
    return {
      id,
      meta: entry.meta || {},
      snapshots: snaps,
      latestValue: latest ? latest.value : null,
      change,
      comps: latest ? (latest.comps || []) : [],
      references: latest ? (latest.references || []) : [],
    };
  });
}

function renderSummary(cards) {
  const total = cards.reduce((sum, c) => sum + (Number(c.latestValue) || 0), 0);
  document.getElementById('stat-total').textContent = fmtMoney(total);
  document.getElementById('stat-count').textContent = cards.length;
  const dates = cards.flatMap(c => c.snapshots.map(s => s.date));
  document.getElementById('stat-updated').textContent = dates.length ? dates.sort().pop() : '—';
}

function cardTile(card) {
  const m = card.meta;
  const title = m.player || 'Unknown Player';
  const metaLine = [m.year, m.set, m.variant].filter(Boolean).join(' · ') +
    (m.card_number ? ` #${m.card_number}` : '');

  const changeClass = card.change === null ? 'flat' : card.change > 0 ? 'up' : card.change < 0 ? 'down' : 'flat';
  const changeSign = card.change > 0 ? '+' : '';
  const changeText = card.change === null ? '—' : `${changeSign}${card.change.toFixed(1)}%`;

  const photoTag = m.photo_filename
    ? `<img src="${PHOTOS_PATH}${m.photo_filename}" alt="${title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=placeholder>No<br>photo</div>'">`
    : `<div class="placeholder">No<br>photo</div>`;

  const compsHtml = card.comps.length
    ? card.comps.map(c => `
        <div class="comp-row">
          <span class="comp-title" title="${c.title || ''}">${c.title || 'Sale'}${c.listing_type === 'fixed_price' ? ' (ask)' : ''}</span>
          <span class="comp-price">${fmtMoney(c.price)}</span>
        </div>`).join('')
    : `<div class="comp-row"><span class="comp-title">No recent comps</span></div>`;

  const contextHtml = card.references.length
    ? `<div class="context-row">${card.references.map(r => `
        <span class="context-chip ${r.value !== null ? 'has-sale' : ''}" title="${r.label}${r.value !== null ? '' : ': no sale this window'}">
          ${r.label}: ${r.value !== null ? fmtMoney(r.value) : 'no sale'}
        </span>`).join('')}</div>`
    : '';

  return `
    <div class="tile" data-search="${(title + ' ' + metaLine).toLowerCase()}">
      <div class="tile-top">
        <div class="photo-wrap">${photoTag}</div>
        <div class="id-block">
          <div class="player">${title}</div>
          <div class="card-meta">${metaLine || '—'}</div>
          ${m.grade ? `<div class="grade-tag">${m.grade}</div>` : ''}
        </div>
      </div>
      <div class="value-row">
        <div class="value">${fmtMoney(card.latestValue)}</div>
        <div class="delta ${changeClass}">${changeText}</div>
      </div>
      ${contextHtml}
      <div class="chart-wrap"><canvas id="chart-${card.id}"></canvas></div>
      <details class="comps">
        <summary>Recent comps</summary>
        ${compsHtml}
      </details>
    </div>
  `;
}

function drawSparkline(card) {
  const canvas = document.getElementById(`chart-${card.id}`);
  if (!canvas || card.snapshots.length < 1) return;

  const labels = card.snapshots.map(s => s.date);
  const values = card.snapshots.map(s => s.value);
  const isUp = card.change === null || card.change >= 0;

  new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: isUp ? '#4ADE80' : '#F87171',
        backgroundColor: isUp ? 'rgba(74,222,128,0.08)' : 'rgba(248,113,113,0.08)',
        borderWidth: 1.75,
        pointRadius: 0,
        tension: 0.3,
        fill: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: (ctx) => fmtMoney(ctx.parsed.y) }
      }},
      scales: {
        x: { display: false },
        y: { display: false },
      },
      elements: { line: { capBezierPoints: true } },
    }
  });
}

function render(cards) {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');

  if (!cards.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = cards.map(cardTile).join('');
  cards.forEach(drawSparkline);
}

function applyFiltersAndSort() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const sortBy = document.getElementById('sort').value;

  let filtered = cardsData.filter(c => {
    const hay = (c.meta.player + ' ' + c.meta.set + ' ' + c.meta.year).toLowerCase();
    return hay.includes(q);
  });

  filtered.sort((a, b) => {
    switch (sortBy) {
      case 'value-desc': return (b.latestValue || 0) - (a.latestValue || 0);
      case 'value-asc': return (a.latestValue || 0) - (b.latestValue || 0);
      case 'change-desc': return (b.change ?? -999) - (a.change ?? -999);
      case 'change-asc': return (a.change ?? 999) - (b.change ?? 999);
      case 'name': return (a.meta.player || '').localeCompare(b.meta.player || '');
      default: return 0;
    }
  });

  render(filtered);
}

async function init() {
  try {
    const res = await fetch(DATA_PATH);
    if (!res.ok) throw new Error('history file not found');
    const history = await res.json();
    cardsData = buildCardObjects(history);
    renderSummary(cardsData);
    applyFiltersAndSort();
  } catch (err) {
    document.getElementById('grid').innerHTML = '';
    document.getElementById('empty').style.display = 'block';
    document.getElementById('empty').textContent =
      'No price data yet. Run fetch_prices.py to generate data/price_history.json.';
    console.error(err);
  }
}

document.getElementById('search').addEventListener('input', applyFiltersAndSort);
document.getElementById('sort').addEventListener('change', applyFiltersAndSort);

init();
</script>
</body>
</html>
