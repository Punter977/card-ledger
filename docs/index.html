<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Card Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
function themeColor(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function(){try{var t=localStorage.getItem('card_ledger_theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<style>
  /* ---------- tokens ---------- */
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --tap: 44px;
  }
  :root, :root[data-theme="light"] {
    --bg: #fafafa;
    --surface: #ffffff;
    --raised: #f4f4f5;
    --line: rgba(23, 23, 23, 0.08);
    --line-strong: rgba(23, 23, 23, 0.14);
    --text: #171717;
    --text-2: #525252;
    --text-muted: #737373;
    --accent: #aff33e;
    --accent-fg: #111111;
    --accent-text: #3f6212;
    --accent-soft: rgba(175, 243, 62, 0.22);
    --chart-line: #3f6212;
    --up: #16a34a;
    --down: #dc2626;
    --overlay: rgba(23, 23, 23, 0.40);
    --float-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #141415;
    --surface: #19191b;
    --raised: #232325;
    --line: rgba(237, 237, 237, 0.08);
    --line-strong: rgba(237, 237, 237, 0.14);
    --text: #ededed;
    --text-2: #a1a1a6;
    --text-muted: #85858b;
    --accent: #aff33e;
    --accent-fg: #111111;
    --accent-text: #aff33e;
    --accent-soft: rgba(175, 243, 62, 0.10);
    --chart-line: #aff33e;
    --up: #4cc38a;
    --down: #e5484d;
    --overlay: rgba(0, 0, 0, 0.60);
    --float-shadow: none;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.4;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; }
  .num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  svg.i { width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; display: block; }

  :focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    height: calc(56px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 17px; font-weight: 600; letter-spacing: 0; }
  header .actions { display: flex; align-items: center; gap: 8px; }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 16px;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-fg);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    transition: filter 150ms var(--ease), transform 150ms var(--ease);
  }
  .btn-primary:hover { filter: brightness(0.96); }
  .btn-primary:active { transform: scale(0.98); }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 36px;
    min-width: 36px;
    padding: 0 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-2);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 150ms var(--ease), color 150ms var(--ease), border-color 150ms var(--ease);
  }
  .icon-btn:hover { background: var(--raised); color: var(--text); }
  .icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .icon-btn.danger:hover { color: var(--down); }
  .icon-btn.square { padding: 0; width: 36px; }

  /* ---------- page ---------- */
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 20px 64px;
  }

  .hero { padding: 32px 0 8px; }
  .hero-label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
  .hero-total {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 40px;
    font-weight: 500;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .hero-sub {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 12px;
    font-size: 14px;
    color: var(--text-2);
  }
  .hero-change { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 14px; }
  .hero-change:empty { display: none; }
  .hero-change.up { color: var(--up); }
  .hero-change.down { color: var(--down); }
  .hero-change.flat { color: var(--text-muted); }

  /* ---------- portfolio chart ---------- */
  .portfolio-chart-box { margin: 16px 0 24px; }
  .portfolio-chart-wrap { height: 168px; position: relative; }
  .portfolio-chart-empty {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--text-muted);
    border: 1px dashed var(--line-strong);
    border-radius: 12px;
  }

  /* ---------- toolbar ---------- */
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
  .search-wrap { position: relative; flex: 1; min-width: 0; }
  .search-wrap svg.i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  .toolbar input {
    width: 100%;
    height: var(--tap);
    padding: 0 12px 0 36px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-size: 16px;
    transition: border-color 150ms var(--ease);
  }
  .toolbar input::placeholder { color: var(--text-muted); }
  .toolbar input:focus { outline: none; border-color: var(--accent-text); }

  /* Sort control: shows only an icon when closed, but is still a real
     native <select> underneath (invisible, stretched over the icon) -
     tapping it opens the normal OS dropdown/wheel with full option text,
     just like any other select. This is purely a compact "closed" state. */
  .sort-icon-btn {
    position: relative;
    width: var(--tap);
    height: var(--tap);
    flex-shrink: 0;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-2);
  }
  .sort-icon-btn:has(select:focus-visible) { outline: 2px solid var(--accent-text); outline-offset: 2px; }
  .sort-icon-btn select {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: none;
    background: transparent;
    cursor: pointer;
  }

  /* ---------- card list ---------- */
  .list {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .list:empty { display: none; }

  .card-row {
    display: grid;
    grid-template-columns: 24px 52px minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
    padding: 12px 16px 12px 12px;
    cursor: pointer;
    transition: background-color 150ms var(--ease);
  }
  .card-row + .card-row { border-top: 1px solid var(--line); }
  .card-row:hover { background: var(--raised); }
  .card-row:active { background: var(--raised); }
  .card-row:focus-visible { outline-offset: -2px; }

  .row-rank {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--text-muted);
    text-align: right;
  }

  /* toploader frame: a thin sleeve around the photo */
  .row-thumb, .photo-wrap {
    flex-shrink: 0;
    padding: 2px;
    border-radius: 6px;
    background: var(--raised);
    border: 1px solid var(--line-strong);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
  }
  .row-thumb { width: 52px; height: 72px; }
  .row-thumb img, .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 4px;
  }

  .row-body { min-width: 0; }
  .row-title {
    font-size: 15px;
    font-weight: 500;
    line-height: 20px;
    overflow-wrap: break-word;
  }
  .row-sub {
    font-size: 13px;
    line-height: 18px;
    color: var(--text-2);
    margin-top: 2px;
    overflow-wrap: break-word;
  }
  .row-foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    margin-top: 8px;
  }
  .row-lastsale {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--text-muted);
  }

  .row-figures { text-align: right; align-self: center; }
  .row-value {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
  }
  .row-change {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    margin-top: 4px;
    white-space: nowrap;
  }
  .row-change.up, .delta.up { color: var(--up); }
  .row-change.down, .delta.down { color: var(--down); }
  .row-change.flat, .delta.flat { color: var(--text-muted); }

  /* ---------- signature: grading-slab label ---------- */
  .slab {
    display: inline-flex;
    align-items: center;
    height: 20px;
    padding: 0 6px 0 8px;
    border-radius: 4px;
    border: 1px solid var(--line-strong);
    border-left: 3px solid var(--accent-text);
    background: var(--raised);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
  }
  .slab.raw { border-left-color: var(--line-strong); color: var(--text-2); font-weight: 400; }

  .empty-state {
    text-align: center;
    padding: 64px 20px;
    color: var(--text-muted);
    font-size: 15px;
  }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    max-width: calc(100% - 32px);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    box-shadow: var(--float-shadow);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 30;
    display: none;
  }
  .toast.visible { display: block; animation: rise 220ms var(--ease); }
  .toast.error { color: var(--down); }

  @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes sheet { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* ---------- detail sheet ---------- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--overlay);
    z-index: 20;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.visible { display: flex; }
  .modal-panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 92vh;
    overflow-y: auto;
    position: relative;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    animation: sheet 300ms var(--ease);
  }
  @media (min-width: 640px) {
    .modal-overlay { align-items: center; }
    .modal-panel { border-radius: 20px; padding-bottom: 20px; }
  }

  .modal-drag-handle {
    width: 36px;
    height: 4px;
    background: var(--line-strong);
    border-radius: 2px;
    margin: 8px auto 0;
  }
  @media (min-width: 640px) { .modal-drag-handle { display: none; } }

  .modal-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 0;
  }
  .modal-actions { display: flex; gap: 8px; }

  .tile-top { display: flex; gap: 16px; padding: 16px 20px 0; }
  .photo-wrap { width: 88px; height: 122px; }
  .photo-wrap a { display: block; width: 100%; height: 100%; }
  .photo-wrap.clickable { cursor: zoom-in; }

  .id-block { flex: 1; min-width: 0; padding-top: 4px; }
  .player { font-size: 20px; font-weight: 500; line-height: 1.2; overflow-wrap: break-word; }
  .card-meta { font-size: 14px; color: var(--text-2); margin-top: 4px; line-height: 1.4; }
  .id-block .slab { margin-top: 12px; }

  .value-row {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px 12px;
    padding: 20px 20px 4px;
  }
  .value {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .delta { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 14px; }
  .delta-label { font-size: 13px; color: var(--text-muted); }

  .override-banner {
    margin: 12px 20px 0;
    padding: 8px 12px;
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 13px;
    color: var(--text-2);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .override-banner strong { color: var(--text); font-weight: 500; }

  .text-btn {
    margin-left: auto;
    background: transparent;
    border: none;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 500;
    padding: 4px 0;
    cursor: pointer;
    transition: color 150ms var(--ease);
  }
  .text-btn:hover { color: var(--text); }
  .text-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .section-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    padding: 24px 20px 8px;
  }

  /* ---------- grade breakdown ---------- */
  .tree { padding: 0 20px; }
  .tree-group + .tree-group { margin-top: 12px; }
  .tree-group-label { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
  .tree-item {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 8px 0 20px;
    position: relative;
    border-radius: 8px;
    color: var(--text-muted);
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    transition: background-color 150ms var(--ease), color 150ms var(--ease);
  }
  .tree-item::before {
    content: "";
    position: absolute;
    left: 6px;
    top: 0;
    bottom: 50%;
    width: 8px;
    border-left: 1px solid var(--line-strong);
    border-bottom: 1px solid var(--line-strong);
  }
  .tree-item.has-sale { color: var(--text); }
  .tree-item.is-own { color: var(--accent-text); font-weight: 500; }
  .tree-item.is-override .tree-price { color: var(--accent-text); }
  .tree-label { min-width: 28px; }
  .tree-price { margin-left: auto; }
  .tree-own-tag, .tree-override-tag {
    font-family: var(--font);
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
  }
  .tree-item.clickable { cursor: pointer; }
  .tree-item.clickable:hover { background: var(--raised); }
  .tree-item.active-filter { background: var(--accent-soft); color: var(--text); }

  /* ---------- trend ---------- */
  .chart-label { font-size: 13px; color: var(--text-muted); padding: 24px 20px 4px; }
  .chart-wrap { padding: 0 12px; height: 112px; position: relative; }
  .chart-empty {
    height: 100%;
    margin: 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--text-muted);
    border: 1px dashed var(--line-strong);
    border-radius: 10px;
  }

  /* ---------- comps ---------- */
  .comps { margin-top: 20px; border-top: 1px solid var(--line); padding: 12px 20px 0; }
  .comps summary {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    cursor: pointer;
    list-style: none;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
  }
  .comps summary::-webkit-details-marker { display: none; }
  .comps summary svg.i { width: 14px; height: 14px; transition: transform 160ms var(--ease); }
  .comps[open] summary svg.i { transform: rotate(90deg); }

  .comp-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }
  .comp-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .comp-title {
    font-size: 14px;
    line-height: 1.4;
    color: var(--text-2);
    overflow-wrap: break-word;
  }
  .comp-meta { display: flex; align-items: center; gap: 8px; }
  .comp-date, .manual-tag {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--text-muted);
  }
  .comp-price {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    font-weight: 500;
    flex-shrink: 0;
    color: var(--text);
  }
  .comp-title a { text-decoration: none; }
  .comp-title a:hover { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
  .comp-delete-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    transition: color 150ms var(--ease), background-color 150ms var(--ease);
  }
  .comp-delete-btn svg.i { width: 14px; height: 14px; }
  .comp-delete-btn:hover { color: var(--down); background: var(--raised); }
  .comp-delete-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .add-comp-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  button.secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 36px;
    padding: 0 12px;
    border-radius: 10px;
    background: var(--raised);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 150ms var(--ease), border-color 150ms var(--ease), transform 150ms var(--ease);
  }
  button.secondary:hover { border-color: var(--line-strong); }
  button.secondary:active { transform: scale(0.98); }
  button.secondary:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary svg.i { color: var(--text-2); }
  button.secondary.block { display: flex; width: 100%; margin-top: 8px; }

  .add-comp-form { margin-top: 12px; display: none; flex-direction: column; gap: 8px; }
  .add-comp-form.visible { display: flex; }
  .add-comp-form input {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 16px;
    transition: border-color 150ms var(--ease);
  }
  .add-comp-form input::placeholder { color: var(--text-muted); }
  .add-comp-form input:focus { outline: none; border-color: var(--accent-text); }
  .field-row-inline { display: flex; gap: 8px; }
  .field-row-inline input { flex: 1; min-width: 0; }
  .add-comp-hint { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

  .comps-filter-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-2);
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    margin: 8px 0;
  }
  .comps-filter-bar strong { color: var(--text); font-weight: 500; }

  @media (max-width: 420px) {
    main { padding: 0 16px 64px; }
    header { padding-left: 16px; padding-right: 16px; }
    .hero-total { font-size: 36px; }
    .card-row { grid-template-columns: 20px 44px minmax(0, 1fr) auto; gap: 10px; padding: 12px 12px 12px 8px; }
    .row-thumb { width: 44px; height: 62px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<script>
const PHOTOS_PATH = 'photos/';
const DATA_PATH = 'data/price_history.json';
// Repo-relative paths (from the root, not from docs/) for GitHub API writes.
const DATA_PATH_REPO = 'docs/data/price_history.json';
const CSV_PATH_REPO = 'docs/data/cards.csv';
const SETTINGS_KEY = 'card_ledger_settings_v1'; // shared with add.html

let cardsData = [];
let rawHistory = {};
let activeChart = null; // the one Chart.js instance backing whichever modal is open
let openCardId = null;

// ---------- icons (lucide, 1.5 stroke) ----------
const ICON_PATHS = {
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  pencil: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  external: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  chevron: '<path d="m9 18 6-6-6-6"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  image: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
};
function icon(name) {
  return `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON_PATHS[name] || ''}</svg>`;
}
const PHOTO_PLACEHOLDER = icon('image');
// Swaps a broken card photo for the placeholder icon.
function photoFailed(img) {
  const holder = img.closest('.row-thumb, .photo-wrap');
  if (holder) { holder.classList.remove('clickable'); holder.innerHTML = PHOTO_PLACEHOLDER; }
}

// One money format everywhere: $1,234.56
function fmtMoney(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return '$' + Number(n).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// Whole-dollar version for small chart labels: $1,235
function fmtMoneyShort(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return '$' + Math.round(Number(n)).toLocaleString('en-AU');
}
function fmtPct(p) {
  if (p === null || p === undefined || isNaN(p)) return '—';
  return `${p > 0 ? '+' : ''}${p.toFixed(1)}%`;
}
function changeClassOf(p) {
  return p === null || p === undefined ? 'flat' : p > 0 ? 'up' : p < 0 ? 'down' : 'flat';
}

// Our own data always stores dates as YYYY-MM-DD - display as dd/mm/yy.
function fmtDateDMY(iso) {
  if (!iso) return '';
  const parts = iso.split('-');
  if (parts.length !== 3) return iso;
  const [y, m, d] = parts;
  return `${d}/${m}/${y.slice(2)}`;
}

function slabHtml(grade) {
  return grade ? `<span class="slab">${grade}</span>` : `<span class="slab raw">Raw</span>`;
}

function showToast(kind, msg) {
  const el = document.getElementById('toast');
  el.className = `toast visible ${kind}`;
  el.textContent = msg;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('visible'), 4000);
}

// ---------- GitHub write helpers (shared settings with add.html) ----------
function getSettings() {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); } catch { return {}; }
}
function hasGithubConnection() {
  const s = getSettings();
  return !!(s.owner && s.repo && s.token);
}
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function base64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
async function ghFetch(path, options = {}) {
  const s = getSettings();
  const url = `https://api.github.com/repos/${s.owner}/${s.repo}/contents/${path}`;
  return fetch(url, {
    ...options,
    headers: {
      'Authorization': `Bearer ${s.token}`,
      'Accept': 'application/vnd.github+json',
      ...(options.headers || {}),
    },
  });
}
async function ghApiFetch(apiPath) {
  const s = getSettings();
  const url = `https://api.github.com/repos/${s.owner}/${s.repo}/${apiPath}`;
  return fetch(url, {
    headers: { 'Authorization': `Bearer ${s.token}`, 'Accept': 'application/vnd.github+json' },
  });
}
async function getExistingFile(path) {
  const res = await ghFetch(path);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`Couldn't read ${path} (${res.status}). Check your token's permissions.`);
  const data = await res.json();
  if (data.content) return data; // small file - Contents API included it inline

  // GitHub's Contents API omits `content` for files over 1MB. As
  // price_history.json accumulates daily snapshots across many cards, it
  // can grow past that threshold - fall back to the Git Blobs API, which
  // handles files up to 100MB, using the sha we already have.
  const blobRes = await ghApiFetch(`git/blobs/${data.sha}`);
  if (!blobRes.ok) throw new Error(`Couldn't read ${path} via the blobs API (${blobRes.status}) - it may have grown too large.`);
  const blob = await blobRes.json();
  return { ...data, content: blob.content };
}
async function putFile(path, base64Content, message, sha) {
  const s = getSettings();
  const body = { message, content: base64Content, branch: s.branch || 'main' };
  if (sha) body.sha = sha;
  const res = await ghFetch(path, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(`Failed to write ${path} (${res.status}): ${err.message || 'unknown error'}`);
  }
  return res.json();
}

// Minimal CSV parse/serialize (handles quoted fields) - needed here only
// for deleting a row out of cards.csv when a card is deleted.
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (rows.length && rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') rows.pop();
  const header = rows.length ? rows[0] : [];
  const dataRows = rows.slice(1).map(r => {
    const obj = {};
    header.forEach((col, i) => { obj[col.trim()] = r[i] ?? ''; });
    return obj;
  });
  return { header: header.map(h => h.trim()), rows: dataRows };
}
function csvEscape(v) {
  v = (v ?? '').toString();
  if (/[",\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
  return v;
}
function serializeCSV(header, rows) {
  const lines = [header.join(',')];
  for (const row of rows) lines.push(header.map(col => csvEscape(row[col] ?? '')).join(','));
  return lines.join('\n') + '\n';
}

// ---------- chart styling ----------
const CHART_FONT = '"JetBrains Mono", ui-monospace, Menlo, monospace';

function hexToRgba(hex, alpha) {
  const h = (hex || '').replace('#', '');
  if (h.length !== 6) return `rgba(128,128,128,${alpha})`;
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}
// Soft fill under the line: one hue fading to transparent, never a hue-to-hue gradient.
function lineFill(lineColor) {
  return (context) => {
    const { chart } = context;
    const { ctx, chartArea } = chart;
    if (!chartArea) return 'transparent';
    const g = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
    g.addColorStop(0, hexToRgba(lineColor, 0.16));
    g.addColorStop(1, hexToRgba(lineColor, 0));
    return g;
  };
}
function tooltipStyle() {
  return {
    backgroundColor: themeColor('--surface'),
    borderColor: themeColor('--line-strong'),
    borderWidth: 1,
    titleColor: themeColor('--text-muted'),
    bodyColor: themeColor('--text'),
    titleFont: { family: CHART_FONT, size: 11, weight: '400' },
    bodyFont: { family: CHART_FONT, size: 13, weight: '500' },
    padding: 8,
    cornerRadius: 8,
    displayColors: false,
    callbacks: { title: (items) => items.length ? fmtDateDMY(items[0].label) : '' },
  };
}

// Labels the highest and lowest points directly on the line, since the
// y-axis is hidden (too small a chart to spare the space) and a legend
// would be overkill for a single line.
const highLowLabelPlugin = {
  id: 'highLowLabel',
  afterDatasetsDraw(chart) {
    const data = chart.data.datasets[0]?.data;
    if (!data) return;
    const meta = chart.getDatasetMeta(0);

    let maxIdx = -1, minIdx = -1, maxVal = -Infinity, minVal = Infinity;
    data.forEach((v, i) => {
      if (v === null || v === undefined) return;
      if (v > maxVal) { maxVal = v; maxIdx = i; }
      if (v < minVal) { minVal = v; minIdx = i; }
    });
    if (maxIdx === -1) return;

    const { ctx } = chart;
    ctx.save();
    ctx.font = `400 11px ${CHART_FONT}`;
    ctx.fillStyle = themeColor('--text-muted');

    const drawLabel = (idx, val, above) => {
      const point = meta.data[idx];
      if (!point) return;
      // keep labels inside the canvas near the edges
      const w = ctx.measureText(fmtMoneyShort(val)).width;
      const x = Math.min(Math.max(point.x, chart.chartArea.left + w / 2), chart.chartArea.right - w / 2);
      ctx.textAlign = 'center';
      ctx.textBaseline = above ? 'bottom' : 'top';
      ctx.fillText(fmtMoneyShort(val), x, point.y + (above ? -6 : 6));
    };

    drawLabel(maxIdx, maxVal, true);
    if (minIdx !== maxIdx) drawLabel(minIdx, minVal, false);

    ctx.restore();
  }
};
Chart.register(highLowLabelPlugin);

function pctChange(first, last) {
  if (!first || !last || first === 0) return null;
  return ((last - first) / first) * 100;
}

function median(nums) {
  const sorted = [...nums].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

// Splits a grade string like "BGS 8.5" into ["BGS", "8.5"], or [null, null]
// if blank (raw card) - mirrors fetch_prices.py's parse_grade_string.
function parseGradeString(gradeStr) {
  const s = (gradeStr || '').trim();
  if (!s) return [null, null];
  const parts = s.split(/\s+/);
  if (parts.length < 2) return [null, null];
  return [parts[0].toUpperCase(), parts[1]];
}

// Splits a pooled-sale "label" (e.g. "Raw", "PSA 9") into a company key
// and a grade value (null for Raw) for tree grouping.
function parseLabel(label) {
  const s = (label || 'Raw').trim();
  if (/^raw$/i.test(s)) return { company: 'Raw', grade: null };
  const parts = s.split(/\s+/);
  if (parts.length >= 2) return { company: parts[0].toUpperCase(), grade: parts.slice(1).join(' ') };
  if (/^\d+(\.\d)?$/.test(s)) return { company: 'Graded (unspecified)', grade: s };
  return { company: s.toUpperCase(), grade: null };
}

// Pools every confirmed sale collected across all stored snapshots (raw +
// every grade queried, from every day fetch_prices.py has run) PLUS any
// manually-added comps, dedupes by listing URL - since the free tier's
// 3-day lookback means the same sale can legitimately show up in several
// consecutive days' pulls. This is the single source of truth for the
// trend line, the grade-breakdown tree, and the "Recent comps" list.
function poolDedupedSales(snapshots, manualComps) {
  const seen = new Set();
  const all = [];
  const addSale = (sale, source) => {
    if (sale.price === null || sale.price === undefined || !sale.date) return;
    const key = sale.url || `${sale.date}-${sale.price}-${sale.label}-${source}`;
    if (seen.has(key)) return;
    seen.add(key);
    all.push({
      price: sale.price, date: sale.date, url: sale.url || '',
      title: sale.title || '', label: sale.label || 'Raw', source,
      added_at: sale.added_at || '',
    });
  };
  for (const snap of snapshots) {
    for (const sale of (snap.pooled_sales || [])) addSale(sale, 'api');
  }
  for (const mc of (manualComps || [])) addSale(mc, 'manual');
  all.sort((a, b) => a.date.localeCompare(b.date));
  return all;
}

// Computes a 30-day trailing average as of each snapshot date, from the
// deduped sale pool above. This gives vintage/thinly-traded cards a
// usable trend line even when their exact grade rarely has a sale in any
// single 3-day window.
function computeRollingAverage(snapshots, allSales) {
  const WINDOW_DAYS = 30;
  return snapshots.map(snap => {
    const asOf = new Date(snap.date);
    const windowStart = new Date(asOf);
    windowStart.setDate(windowStart.getDate() - WINDOW_DAYS);
    const inWindow = allSales.filter(s => {
      const d = new Date(s.date);
      return d >= windowStart && d <= asOf;
    });
    if (!inWindow.length) return null;
    const avg = inWindow.reduce((sum, s) => sum + s.price, 0) / inWindow.length;
    return Math.round(avg * 100) / 100;
  });
}

// Rebuilds the Raw/company/grade breakdown entirely from the accumulated,
// deduped sale pool (API history + manual comps combined) rather than
// relying on a single day's server-computed tree. This means the tree
// reflects your FULL accumulated history, not just the latest 3-day pull -
// and it updates the moment you add a manual comp, with no need to wait
// for the next scheduled run.
function buildLiveTree(allSales, grader, grade) {
  const groups = {}; // company -> { gradeKey: sales[] }  (gradeKey '__raw__' for Raw)
  for (const sale of allSales) {
    const { company, grade: gVal } = parseLabel(sale.label);
    const gradeKey = gVal === null ? '__raw__' : gVal;
    groups[company] = groups[company] || {};
    groups[company][gradeKey] = groups[company][gradeKey] || [];
    groups[company][gradeKey].push(sale);
  }

  const ownCompany = grader || 'Raw';
  const ownGradeKey = grader ? grade : '__raw__';
  groups[ownCompany] = groups[ownCompany] || {};
  groups[ownCompany][ownGradeKey] = groups[ownCompany][ownGradeKey] || [];

  const companies = Object.keys(groups).sort((a, b) => {
    if (a === 'Raw') return -1;
    if (b === 'Raw') return 1;
    return a.localeCompare(b);
  });

  const tree = [];
  let ownValue = null, ownSampleSize = 0;

  for (const company of companies) {
    const gradeKeys = Object.keys(groups[company]).sort((a, b) => {
      if (a === '__raw__') return -1;
      if (b === '__raw__') return 1;
      return parseFloat(b) - parseFloat(a);
    });
    const items = [];
    for (const gk of gradeKeys) {
      const sales = groups[company][gk];
      const prices = sales.map(s => s.price);
      const value = prices.length ? Math.round(median(prices) * 100) / 100 : null;
      const label = gk === '__raw__' ? 'Raw' : gk;
      const isOwn = (company === ownCompany && gk === ownGradeKey);
      const comps = sales.slice(-2).reverse().map(s => ({ price: s.price, date: s.date, title: s.title, url: s.url }));
      const fullSales = sales.slice().reverse().map(s => ({ price: s.price, date: s.date, title: s.title, url: s.url, source: s.source, added_at: s.added_at }));
      items.push({ label, value, sample_size: sales.length, comps, allSales: fullSales, is_own: isOwn });
      if (isOwn) { ownValue = value; ownSampleSize = sales.length; }
    }
    tree.push({ group: company, items });
  }

  return { tree, ownValue, ownSampleSize };
}

function buildCardObjects(history) {
  return Object.entries(history).map(([id, entry]) => {
    const snaps = (entry.snapshots || []).slice().sort((a, b) => a.date.localeCompare(b.date));
    const manualComps = entry.manual_comps || [];
    const meta = entry.meta || {};
    const allSales = poolDedupedSales(snaps, manualComps);
    const rollingAvg = computeRollingAverage(snaps, allSales);

    const [grader, grade] = parseGradeString(meta.grade);
    const { tree, ownValue, ownSampleSize } = buildLiveTree(allSales, grader, grade);

    // A price override (set via the tree's "Use as my price" action) lets
    // you pin the displayed value to a DIFFERENT grade's comp when your
    // exact grade hasn't sold in a while - e.g. pricing a quiet BGS 9 off
    // a recent PSA 9 sale. The tree itself still shows the truthful
    // per-grade breakdown; this only changes which number is the headline.
    const override = entry.value_override || null;
    if (override) {
      for (const group of tree) {
        for (const item of group.items) {
          if (`${group.group} ${item.label}`.replace('Raw Raw', 'Raw') === override.label) {
            item.is_override = true;
          }
        }
      }
    }
    const latestValue = override ? override.value : ownValue;

    const asOfLatest = snaps.length ? new Date(snaps[snaps.length - 1].date)
      : (allSales.length ? new Date(allSales[allSales.length - 1].date) : null);
    let salesLast30 = 0;
    if (asOfLatest) {
      const windowStart = new Date(asOfLatest);
      windowStart.setDate(windowStart.getDate() - 30);
      salesLast30 = allSales.filter(s => {
        const d = new Date(s.date);
        return d >= windowStart && d <= asOfLatest;
      }).length;
    }

    const firstAvg = rollingAvg.find(v => v !== null);
    const lastAvg = [...rollingAvg].reverse().find(v => v !== null);
    const change = (firstAvg !== undefined && lastAvg !== undefined) ? pctChange(firstAvg, lastAvg) : null;

    const recentComps = allSales.slice(-8).reverse();
    const lastSaleDate = allSales.length ? allSales[allSales.length - 1].date : null;

    return {
      id, meta, snapshots: snaps, manualComps, allSales,
      latestValue, priceOverride: override,
      change, comps: recentComps, tree, rollingAvg, salesLast30, lastSaleDate,
    };
  });
}

// Total portfolio value at each date any card was priced, computed by
// reusing buildLiveTree with each card's sales filtered to "on or before
// that date" - this is the exact same logic that produces today's
// headline TOTAL, just re-run at each historical cutoff, so the chart's
// most recent point always matches the TOTAL stat exactly.
function computePortfolioSeries(cards) {
  const allDates = new Set();
  cards.forEach(c => c.snapshots.forEach(s => allDates.add(s.date)));
  const dates = Array.from(allDates).sort();

  const totals = dates.map(d => {
    let sum = 0;
    for (const card of cards) {
      const hasStartedByD = card.snapshots.some(s => s.date <= d);
      if (!hasStartedByD) continue; // not yet tracked as of this date - excluded, not zero
      const salesUpToD = (card.allSales || []).filter(s => s.date <= d);
      const [grader, grade] = parseGradeString(card.meta.grade);
      const { ownValue } = buildLiveTree(salesUpToD, grader, grade);
      sum += ownValue || 0;
    }
    return Math.round(sum * 100) / 100;
  });

  return { dates, totals };
}

function renderSummary(cards) {
  const total = cards.reduce((sum, c) => sum + (Number(c.latestValue) || 0), 0);
  document.getElementById('stat-total').textContent = fmtMoney(total);
  document.getElementById('stat-count').textContent = cards.length;
  const dates = cards.flatMap(c => c.snapshots.map(s => s.date));
  document.getElementById('stat-updated').textContent = dates.length ? fmtDateDMY(dates.sort().pop()) : '—';
}

// ---------- list row ----------
function cardRow(card, rank) {
  const m = card.meta;
  const title = m.player || 'Unknown player';
  const metaLine = [m.year, m.set, m.variant].filter(Boolean).join(' · ') +
    (m.card_number ? ` #${m.card_number}` : '');

  const hasPhoto = !!m.photo_filename;
  const thumbInner = hasPhoto
    ? `<img src="${PHOTOS_PATH}${m.photo_filename}" alt="${title}" loading="lazy" onerror="photoFailed(this)">`
    : PHOTO_PLACEHOLDER;

  return `
    <div class="card-row" role="button" tabindex="0" data-card-id="${card.id}" data-search="${(title + ' ' + metaLine).toLowerCase()}">
      <div class="row-rank">${rank}</div>
      <div class="row-thumb">${thumbInner}</div>
      <div class="row-body">
        <div class="row-title">${title}</div>
        <div class="row-sub">${metaLine || '—'}</div>
        <div class="row-foot">
          ${slabHtml(m.grade)}
          ${card.lastSaleDate ? `<span class="row-lastsale">Last sale ${fmtDateDMY(card.lastSaleDate)}</span>` : ''}
        </div>
      </div>
      <div class="row-figures">
        <div class="row-value">${fmtMoney(card.latestValue)}</div>
        <div class="row-change ${changeClassOf(card.change)}" title="Change in the 30-day average since tracking began">${fmtPct(card.change)}</div>
      </div>
    </div>
  `;
}

function renderList(cards) {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');

  if (!cards.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = cards.map((c, i) => cardRow(c, i + 1)).join('');
}

// ---------- detail sheet ----------
function modalContent(card) {
  modalTreeSalesIndex = {}; // rebuilt fresh on every render (tree-item clicks reference this by key)
  const m = card.meta;
  const title = m.player || 'Unknown player';
  const metaLine = [m.year, m.set, m.variant].filter(Boolean).join(' · ') +
    (m.card_number ? ` #${m.card_number}` : '');

  const hasPhoto = !!m.photo_filename;
  const photoInner = hasPhoto
    ? `<img src="${PHOTOS_PATH}${m.photo_filename}" alt="${title}" loading="lazy" onerror="photoFailed(this)">`
    : PHOTO_PLACEHOLDER;
  const photoHtml = hasPhoto
    ? `<a href="${PHOTOS_PATH}${m.photo_filename}" target="_blank" rel="noopener" aria-label="Open full photo">${photoInner}</a>`
    : photoInner;

  const compsHtml = renderCompRows(card.comps);

  const treeHtml = card.tree.length
    ? `<div class="section-label">Grade breakdown</div>
      <div class="tree">${card.tree.map((group, gi) => `
        <div class="tree-group">
          <div class="tree-group-label">${group.group}</div>
          ${group.items.map((item, ii) => {
            const clickable = item.value !== null && item.allSales && item.allSales.length > 0;
            if (clickable) modalTreeSalesIndex[`${gi}-${ii}`] = { label: `${group.group} ${item.label}`.replace('Raw Raw', 'Raw'), sales: item.allSales, value: item.value, isOwn: item.is_own };
            return `
            <div class="tree-item ${item.value !== null ? 'has-sale' : ''} ${item.is_own ? 'is-own' : ''} ${item.is_override ? 'is-override' : ''} ${clickable ? 'clickable' : ''}"
                 ${clickable ? `data-action="filter-comps" data-tree-key="${gi}-${ii}" role="button" tabindex="0"` : ''}
                 title="${item.is_own ? 'Your card' : ''}${item.value !== null ? (clickable ? ' · tap to filter comps below' : '') : 'No sale recorded'}">
              <span class="tree-label">${item.label}</span>
              ${item.is_own ? '<span class="tree-own-tag">yours</span>' : ''}
              ${item.is_override ? '<span class="tree-override-tag">pricing from this</span>' : ''}
              <span class="tree-price">${item.value !== null ? fmtMoney(item.value) : 'no sale'}</span>
            </div>
          `; }).join('')}
        </div>
      `).join('')}</div>`
    : '';

  const editParams = new URLSearchParams({
    edit: '1', player: m.player || '', year: m.year || '', set: m.set || '',
    card_number: m.card_number || '', grade: m.grade || '',
  });
  const editUrl = `add.html?${editParams.toString()}`;
  const deleteLabel = `${title} — ${m.set || ''}`.trim();

  // Same query shape fetch_prices.py builds server-side, so a manual
  // 130point check searches for the same thing the automated pull does.
  const searchQuery = [
    m.player, m.year, m.set, m.card_number ? `#${m.card_number}` : '', m.variant,
  ].filter(Boolean).join(' ');

  const hasTrend = card.rollingAvg.some(v => v !== null);

  return `
    <div class="modal-drag-handle"></div>
    <div class="modal-bar">
      <div class="modal-actions">
        <a href="${editUrl}" class="icon-btn">${icon('pencil')}<span>Edit</span></a>
        <button class="icon-btn square danger delete-btn" data-action="delete-card" data-card-id="${card.id}" data-label="${deleteLabel}" aria-label="Delete card" title="Delete card">${icon('trash')}</button>
      </div>
      <button class="icon-btn square modal-close" data-action="close-modal" aria-label="Close" title="Close">${icon('x')}</button>
    </div>
    <div class="tile-top">
      <div class="photo-wrap ${hasPhoto ? 'clickable' : ''}">${photoHtml}</div>
      <div class="id-block">
        <div class="player">${title}</div>
        <div class="card-meta">${metaLine || '—'}</div>
        ${slabHtml(m.grade)}
      </div>
    </div>
    <div class="value-row">
      <div class="value">${fmtMoney(card.latestValue)}</div>
      <div class="delta ${changeClassOf(card.change)}" title="Change in the 30-day pooled average (raw + graded) between its earliest and most recent point">${fmtPct(card.change)}</div>
      ${card.change !== null ? '<div class="delta-label">30-day average since tracking began</div>' : ''}
    </div>
    ${card.priceOverride ? `
      <div class="override-banner">
        <span>Priced from <strong>${card.priceOverride.label}</strong>, not your exact grade</span>
        <button class="text-btn" data-action="clear-price-override">Clear</button>
      </div>` : ''}
    ${treeHtml}
    <div class="chart-label">30-day average · ${card.salesLast30} sale${card.salesLast30 === 1 ? '' : 's'} · raw and graded</div>
    <div class="chart-wrap">
      <canvas id="modal-chart" style="${hasTrend ? '' : 'display:none;'}" role="img" aria-label="30-day average price trend"></canvas>
      ${hasTrend ? '' : '<div class="chart-empty">No sales yet to show a trend</div>'}
    </div>
    <details class="comps" open>
      <summary>${icon('chevron')}<span>Recent comps</span></summary>
      <div id="modal-comps-filter"></div>
      <div id="modal-comps-list">${compsHtml}</div>
      <div class="add-comp-row">
        <button class="secondary" data-action="search-130point" data-query="${searchQuery.replace(/"/g, '&quot;')}">${icon('external')}<span>Search 130point</span></button>
        <button class="secondary" data-action="show-add-comp">${icon('plus')}<span>Add comp</span></button>
      </div>
      <div class="add-comp-form">
        <div class="add-comp-hint">From eBay's sold listings. Goes further back than the automated 3-day pull.</div>
        <div class="field-row-inline">
          <input type="text" class="mc-price" inputmode="decimal" placeholder="Price, e.g. 45.00" aria-label="Price">
          <input type="text" class="mc-date" placeholder="YYYY-MM-DD" aria-label="Sale date">
        </div>
        <input type="text" class="mc-label" placeholder="Grade, e.g. Raw or PSA 9" aria-label="Grade">
        <div class="add-comp-hint">Include the grading company, "PSA 9" rather than "9", so it groups correctly</div>
        <input type="text" class="mc-title" placeholder="Listing title (optional)" aria-label="Listing title">
        <input type="text" class="mc-url" inputmode="url" placeholder="eBay link (optional)" aria-label="eBay link">
        <div class="field-row-inline">
          <button class="secondary" data-action="save-comp">Save comp</button>
          <button class="secondary" data-action="cancel-comp">Cancel</button>
        </div>
      </div>
    </details>
  `;
}

function drawModalChart(card) {
  if (activeChart) { activeChart.destroy(); activeChart = null; }
  const canvas = document.getElementById('modal-chart');
  if (!canvas || card.snapshots.length < 1) return;

  const labels = card.snapshots.map(s => s.date);
  const values = card.rollingAvg;
  if (!values.some(v => v !== null)) return;

  const line = themeColor('--chart-line');

  activeChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: line,
        backgroundColor: lineFill(line),
        borderWidth: 1.75,
        pointRadius: 0,
        pointHoverRadius: 3,
        pointHoverBackgroundColor: line,
        tension: 0.3,
        fill: true,
        spanGaps: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      layout: { padding: { top: 20, bottom: 20, right: 8, left: 8 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          ...tooltipStyle(),
          callbacks: {
            title: (items) => items.length ? fmtDateDMY(items[0].label) : '',
            label: (ctx) => ctx.parsed.y === null ? 'No sales in window' : fmtMoney(ctx.parsed.y),
          },
        },
      },
      scales: { x: { display: false }, y: { display: false } },
      elements: { line: { capBezierPoints: true } },
    }
  });
}

let portfolioChart = null;

function drawPortfolioChart(cards) {
  const canvas = document.getElementById('portfolio-chart');
  const emptyMsg = document.getElementById('portfolio-chart-empty');
  const changeEl = document.getElementById('stat-change');
  if (portfolioChart) { portfolioChart.destroy(); portfolioChart = null; }

  const { dates, totals } = computePortfolioSeries(cards);

  // Headline change: latest total compared with the first tracked total.
  if (totals.length >= 2 && totals[0]) {
    const p = pctChange(totals[0], totals[totals.length - 1]);
    changeEl.className = `hero-change ${changeClassOf(p)}`;
    changeEl.textContent = p === null ? '' : `${fmtPct(p)} since ${fmtDateDMY(dates[0])}`;
  } else {
    changeEl.textContent = '';
  }

  // Need at least 2 distinct-value points for a trend to mean anything -
  // a single data point (day one) is just today's total, not a "trend".
  const hasRealTrend = totals.length >= 2 && new Set(totals).size > 1;
  if (!hasRealTrend) {
    canvas.style.display = 'none';
    emptyMsg.style.display = 'flex';
    return;
  }
  canvas.style.display = '';
  emptyMsg.style.display = 'none';

  const line = themeColor('--chart-line');
  const muted = themeColor('--text-muted');

  portfolioChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels: dates,
      datasets: [{
        data: totals,
        borderColor: line,
        backgroundColor: lineFill(line),
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 4,
        pointHoverBackgroundColor: line,
        tension: 0.25,
        fill: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      layout: { padding: { top: 20, bottom: 0, right: 4, left: 4 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          ...tooltipStyle(),
          callbacks: {
            title: (items) => items.length ? fmtDateDMY(items[0].label) : '',
            label: (ctx) => fmtMoney(ctx.parsed.y),
          },
        },
      },
      scales: {
        x: {
          display: true,
          grid: { display: false },
          border: { display: false },
          ticks: {
            color: muted,
            font: { family: CHART_FONT, size: 11 },
            maxTicksLimit: 4,
            maxRotation: 0,
            autoSkip: true,
            callback: function (value) { return fmtDateDMY(this.getLabelForValue(value)); },
          },
        },
        y: { display: false },
      },
    }
  });
}

let modalTreeSalesIndex = {}; // reset each time the modal opens - tree-item key -> {label, sales}

function renderCompRows(sales) {
  if (!sales || !sales.length) return `<div class="comp-row"><span class="comp-title">No recent comps</span></div>`;
  return sales.map(c => `
    <div class="comp-row">
      <div class="comp-main">
        <span class="comp-title" title="${(c.title || '').replace(/"/g, '&quot;')}">${c.url ? `<a href="${c.url}" target="_blank" rel="noopener">${c.title || 'Sale'}</a>` : (c.title || 'Sale')}</span>
        <span class="comp-meta">
          <span class="comp-date">${c.date ? fmtDateDMY(c.date) : ''}</span>
          ${c.source === 'manual' ? `<span class="manual-tag">manual</span><button class="comp-delete-btn" data-action="delete-comp" data-added-at="${c.added_at || ''}" aria-label="Delete this comp" title="Delete this comp">${icon('x')}</button>` : ''}
        </span>
      </div>
      <span class="comp-price">${fmtMoney(c.price)}</span>
    </div>`).join('');
}

function openModal(cardId) {
  const card = cardsData.find(c => c.id === cardId);
  if (!card) return;
  openCardId = cardId;
  document.getElementById('modal-panel').innerHTML = modalContent(card);
  document.getElementById('modal-overlay').classList.add('visible');
  drawModalChart(card);
}

function closeModal() {
  const wasOpen = openCardId;
  document.getElementById('modal-overlay').classList.remove('visible');
  document.getElementById('modal-panel').innerHTML = '';
  if (activeChart) { activeChart.destroy(); activeChart = null; }
  openCardId = null;
  // return keyboard focus to the row that opened the sheet
  if (wasOpen) {
    const row = document.querySelector(`.card-row[data-card-id="${CSS.escape(wasOpen)}"]`);
    if (row) row.focus({ preventScroll: true });
  }
}

// Refreshes the open modal in place after a data change (comp added,
// etc.) without closing and reopening it.
function refreshModalIfOpen() {
  if (openCardId) openModal(openCardId);
}

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && openCardId) closeModal();
});

function applyFiltersAndSort() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const sortBy = document.getElementById('sort').value;

  let filtered = cardsData.filter(c => {
    const hay = (c.meta.player + ' ' + c.meta.set + ' ' + c.meta.year).toLowerCase();
    return hay.includes(q);
  });

  filtered.sort((a, b) => {
    switch (sortBy) {
      case 'value-desc': return (b.latestValue || 0) - (a.latestValue || 0);
      case 'value-asc': return (a.latestValue || 0) - (b.latestValue || 0);
      case 'change-desc': return (b.change ?? -999) - (a.change ?? -999);
      case 'change-asc': return (a.change ?? 999) - (b.change ?? 999);
      case 'last-sale-desc': return (b.lastSaleDate || '').localeCompare(a.lastSaleDate || '');
      case 'added-desc': return (b.meta.added_at || '').localeCompare(a.meta.added_at || '');
      case 'name': return (a.meta.player || '').localeCompare(b.meta.player || '');
      default: return 0;
    }
  });

  renderList(filtered);
}

async function init() {
  try {
    // Cache-bust every load: GitHub Pages sits behind a CDN, and browsers
    // cache fetch() responses too, so without a unique query string a
    // reload can keep serving a stale copy of price_history.json for
    // minutes after a real change (delete, edit, price pull) has landed.
    const res = await fetch(`${DATA_PATH}?t=${Date.now()}`);
    if (!res.ok) throw new Error('history file not found');
    rawHistory = await res.json();
    cardsData = buildCardObjects(rawHistory);
    renderSummary(cardsData);
    drawPortfolioChart(cardsData);
    applyFiltersAndSort();
  } catch (err) {
    document.getElementById('grid').innerHTML = '';
    document.getElementById('empty').style.display = 'block';
    document.getElementById('empty').textContent =
      'No price data yet. Run fetch_prices.py to generate data/price_history.json.';
    console.error(err);
  }
}

// ---------- list: open a card's detail sheet (tap or keyboard) ----------
document.getElementById('grid').addEventListener('click', (e) => {
  const row = e.target.closest('.card-row');
  if (!row) return;
  openModal(row.dataset.cardId);
});
document.getElementById('grid').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest('.card-row');
  if (!row) return;
  e.preventDefault();
  openModal(row.dataset.cardId);
});

// ---------- modal click: close / add-comp / delete (event delegation,
// since the modal's innerHTML gets replaced wholesale on every open) ----------
async function handleModalAction(btn) {
  const action = btn.dataset.action;

  if (action === 'close-modal') {
    closeModal();
  } else if (action === 'search-130point') {
    await handleSearch130point(btn);
  } else if (action === 'filter-comps') {
    handleFilterComps(btn);
  } else if (action === 'clear-comps-filter') {
    handleClearCompsFilter();
  } else if (action === 'set-price-override') {
    await handleSetPriceOverride(btn);
  } else if (action === 'clear-price-override') {
    await handleClearPriceOverride(btn);
  } else if (action === 'delete-comp') {
    await handleDeleteComp(btn);
  } else if (action === 'show-add-comp') {
    document.querySelector('#modal-panel .add-comp-form').classList.add('visible');
    btn.style.display = 'none';
    const first = document.querySelector('#modal-panel .mc-price');
    if (first) first.focus();
  } else if (action === 'cancel-comp') {
    document.querySelector('#modal-panel .add-comp-form').classList.remove('visible');
    document.querySelector('#modal-panel [data-action="show-add-comp"]').style.display = '';
  } else if (action === 'save-comp') {
    await handleSaveComp(btn, openCardId);
  } else if (action === 'delete-card') {
    await handleDeleteCard(btn, btn.dataset.cardId);
  }
}
document.getElementById('modal-panel').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  await handleModalAction(btn);
});
// Tree rows are divs with role="button" - let Enter/Space activate them too.
document.getElementById('modal-panel').addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const item = e.target.closest('.tree-item[data-action]');
  if (!item) return;
  e.preventDefault();
  await handleModalAction(item);
});

// Tapping a tree item (e.g. "PSA 9") filters the comps list below to only
// that grade's sales, reusing the exact same grouped sales the tree cell
// itself was computed from - so what you see filtered always matches
// what the tree displayed for that cell.
function handleFilterComps(btn) {
  const key = btn.dataset.treeKey;
  const entry = modalTreeSalesIndex[key];
  if (!entry) return;

  document.querySelectorAll('#modal-panel .tree-item.active-filter').forEach(el => el.classList.remove('active-filter'));
  btn.classList.add('active-filter');

  document.getElementById('modal-comps-list').innerHTML = renderCompRows(entry.sales);
  const useAsPriceBtn = (!entry.isOwn && entry.value !== null)
    ? `<button class="secondary block" data-action="set-price-override" data-tree-key="${key}">Use ${entry.label} as my price</button>`
    : '';
  document.getElementById('modal-comps-filter').innerHTML = `
    <div class="comps-filter-bar">
      <span>Showing <strong>${entry.label}</strong> · <span class="mono">${entry.sales.length}</span></span>
      <button class="text-btn" data-action="clear-comps-filter">Clear</button>
    </div>
    ${useAsPriceBtn}`;
  const comps = document.querySelector('#modal-panel .comps');
  if (comps) comps.open = true;
}

function handleClearCompsFilter() {
  const card = cardsData.find(c => c.id === openCardId);
  if (!card) return;
  document.querySelectorAll('#modal-panel .tree-item.active-filter').forEach(el => el.classList.remove('active-filter'));
  document.getElementById('modal-comps-list').innerHTML = renderCompRows(card.comps);
  document.getElementById('modal-comps-filter').innerHTML = '';
}

async function handleSetPriceOverride(btn) {
  const key = btn.dataset.treeKey;
  const entry = modalTreeSalesIndex[key];
  if (!entry) return;

  if (!confirm(`Use ${entry.label} (${fmtMoney(entry.value)}) as this card's displayed price? The real breakdown still shows what your exact grade actually sold for - this just sets which number shows as the headline value, until you clear it.`)) return;
  if (!hasGithubConnection()) {
    showToast('error', 'Connect GitHub first: open the Add card page and fill in the connection settings');
    return;
  }

  btn.disabled = true;
  try {
    const existing = await getExistingFile(DATA_PATH_REPO);
    if (!existing) throw new Error('price_history.json not found.');
    const freshHistory = JSON.parse(base64ToUtf8(existing.content));
    const cardEntry = freshHistory[openCardId];
    if (!cardEntry) throw new Error("Couldn't find this card in the history file.");

    cardEntry.value_override = { label: entry.label, value: entry.value, set_at: new Date().toISOString() };

    await putFile(DATA_PATH_REPO, utf8ToBase64(JSON.stringify(freshHistory, null, 2)),
      `Set price override for ${openCardId}: ${entry.label}`, existing.sha);

    rawHistory = freshHistory;
    cardsData = buildCardObjects(rawHistory);
    renderSummary(cardsData);
    drawPortfolioChart(cardsData);
    applyFiltersAndSort();
    refreshModalIfOpen();
    showToast('success', `Now pricing from ${entry.label}`);
  } catch (err) {
    showToast('error', err.message || 'Failed to set price override');
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}

async function handleClearPriceOverride(btn) {
  if (!hasGithubConnection()) {
    showToast('error', 'Connect GitHub first: open the Add card page and fill in the connection settings');
    return;
  }
  btn.disabled = true;
  try {
    const existing = await getExistingFile(DATA_PATH_REPO);
    if (!existing) throw new Error('price_history.json not found.');
    const freshHistory = JSON.parse(base64ToUtf8(existing.content));
    const cardEntry = freshHistory[openCardId];
    if (cardEntry) delete cardEntry.value_override;

    await putFile(DATA_PATH_REPO, utf8ToBase64(JSON.stringify(freshHistory, null, 2)),
      `Clear price override for ${openCardId}`, existing.sha);

    rawHistory = freshHistory;
    cardsData = buildCardObjects(rawHistory);
    renderSummary(cardsData);
    drawPortfolioChart(cardsData);
    applyFiltersAndSort();
    refreshModalIfOpen();
    showToast('success', 'Back to your exact-grade price');
  } catch (err) {
    showToast('error', err.message || 'Failed to clear price override');
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}

async function handleDeleteComp(btn) {
  const addedAt = btn.dataset.addedAt;
  if (!addedAt) {
    showToast('error', "Can't identify this comp to delete it. It may predate this feature.");
    return;
  }
  if (!confirm('Delete this manual comp? This only removes the comp, not the card itself.')) return;
  if (!hasGithubConnection()) {
    showToast('error', 'Connect GitHub first: open the Add card page and fill in the connection settings');
    return;
  }

  btn.disabled = true;
  try {
    const existing = await getExistingFile(DATA_PATH_REPO);
    if (!existing) throw new Error('price_history.json not found.');
    const freshHistory = JSON.parse(base64ToUtf8(existing.content));
    const entry = freshHistory[openCardId];
    if (!entry || !entry.manual_comps) throw new Error("Couldn't find this card's manual comps.");

    const before = entry.manual_comps.length;
    entry.manual_comps = entry.manual_comps.filter(c => c.added_at !== addedAt);
    if (entry.manual_comps.length === before) throw new Error('Comp not found. It may have already been removed.');

    await putFile(DATA_PATH_REPO, utf8ToBase64(JSON.stringify(freshHistory, null, 2)),
      `Delete manual comp from ${openCardId}`, existing.sha);

    rawHistory = freshHistory;
    cardsData = buildCardObjects(rawHistory);
    renderSummary(cardsData);
    drawPortfolioChart(cardsData);
    applyFiltersAndSort();
    refreshModalIfOpen();
    showToast('success', 'Comp deleted');
  } catch (err) {
    showToast('error', err.message || 'Failed to delete comp');
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}

// 130point's search box is entirely JavaScript-driven with no shareable
// URL, so there's no query parameter to pre-fill via a link. The next
// best thing: copy the search text to the clipboard and open the site,
// so it's a one-paste action instead of retyping the card's details.
async function handleSearch130point(btn) {
  const query = btn.dataset.query || '';
  try {
    await navigator.clipboard.writeText(query);
    showToast('success', `Copied "${query}". Paste it into 130point's search box.`);
  } catch (err) {
    // Clipboard access can be blocked (e.g. non-HTTPS context, permission
    // denied) - fall back to just telling them what to type themselves.
    showToast('error', `Couldn't copy automatically. Search for "${query}" on 130point.`);
  }
  window.open('https://130point.com/sales/', '_blank', 'noopener');
}

async function handleSaveComp(btn, cardId) {
  if (!hasGithubConnection()) {
    showToast('error', 'Connect GitHub first: open the Add card page and fill in the connection settings');
    return;
  }
  const panel = document.getElementById('modal-panel');
  const price = parseFloat(panel.querySelector('.mc-price').value);
  const date = panel.querySelector('.mc-date').value.trim();
  const label = panel.querySelector('.mc-label').value.trim() || 'Raw';
  const compTitle = panel.querySelector('.mc-title').value.trim();
  const url = panel.querySelector('.mc-url').value.trim();

  if (!price || isNaN(price)) { showToast('error', 'Enter a valid price'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { showToast('error', 'Date must be in YYYY-MM-DD format'); return; }
  if (!/^raw$/i.test(label) && /^\d+(\.\d)?$/.test(label)) {
    showToast('error', `"${label}" needs a grading company. Try "PSA ${label}" or "BGS ${label}".`);
    return;
  }

  btn.disabled = true;
  try {
    const existing = await getExistingFile(DATA_PATH_REPO);
    const freshHistory = existing ? JSON.parse(base64ToUtf8(existing.content)) : {};
    const entry = freshHistory[cardId] || { meta: {}, snapshots: [] };
    entry.manual_comps = entry.manual_comps || [];
    entry.manual_comps.push({
      price, date, label, title: compTitle, url,
      source: 'manual', added_at: new Date().toISOString(),
    });
    freshHistory[cardId] = entry;

    await putFile(DATA_PATH_REPO, utf8ToBase64(JSON.stringify(freshHistory, null, 2)),
      `Add manual comp: ${cardId}`, existing ? existing.sha : undefined);

    rawHistory = freshHistory;
    cardsData = buildCardObjects(rawHistory);
    renderSummary(cardsData);
    drawPortfolioChart(cardsData);
    applyFiltersAndSort();
    refreshModalIfOpen();
    showToast('success', 'Comp added');
  } catch (err) {
    showToast('error', err.message || 'Failed to save comp');
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}

async function handleDeleteCard(btn, cardId) {
  const label = btn.dataset.label || 'this card';
  if (!confirm(`Delete ${label}? This removes it from your CSV and price history. Photos are left in place.`)) return;

  if (!hasGithubConnection()) {
    showToast('error', 'Connect GitHub first: open the Add card page and fill in the connection settings');
    return;
  }

  btn.disabled = true;
  try {
    const card = cardsData.find(c => c.id === cardId);
    const m = card ? card.meta : {};

    const csvExisting = await getExistingFile(CSV_PATH_REPO);
    if (csvExisting) {
      const text = base64ToUtf8(csvExisting.content);
      const { header, rows } = parseCSV(text);
      const idx = rows.findIndex(r =>
        (r.player || '').trim() === (m.player || '').trim() &&
        (r.year || '').trim() === (m.year || '').trim() &&
        (r.set || '').trim() === (m.set || '').trim() &&
        (r.card_number || '').trim() === (m.card_number || '').trim() &&
        (r.grade || '').trim() === (m.grade || '').trim()
      );
      if (idx !== -1) {
        rows.splice(idx, 1);
        await putFile(CSV_PATH_REPO, utf8ToBase64(serializeCSV(header, rows)), `Delete card: ${label}`, csvExisting.sha);
      }
    }

    const histExisting = await getExistingFile(DATA_PATH_REPO);
    if (histExisting) {
      const freshHistory = JSON.parse(base64ToUtf8(histExisting.content));
      delete freshHistory[cardId];
      await putFile(DATA_PATH_REPO, utf8ToBase64(JSON.stringify(freshHistory, null, 2)), `Delete card history: ${label}`, histExisting.sha);
      rawHistory = freshHistory;
    } else {
      delete rawHistory[cardId];
    }

    cardsData = buildCardObjects(rawHistory);
    renderSummary(cardsData);
    drawPortfolioChart(cardsData);
    applyFiltersAndSort();
    closeModal();
    showToast('success', `${label} deleted`);
  } catch (err) {
    showToast('error', err.message || 'Failed to delete card');
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('search').addEventListener('input', applyFiltersAndSort);
document.getElementById('sort').addEventListener('change', applyFiltersAndSort);

init();
</script>
<script>
(function(){
  var btn=document.getElementById('theme-toggle'); if(!btn) return;
  function cur(){return document.documentElement.getAttribute('data-theme')||'light';}
  function paint(){
    var dark=cur()==='dark';
    btn.innerHTML=icon(dark?'sun':'moon');
    btn.title=dark?'Switch to light':'Switch to dark';
    btn.setAttribute('aria-label',btn.title);
  }
  btn.addEventListener('click',function(){
    var n=cur()==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',n);
    try{localStorage.setItem('card_ledger_theme',n);}catch(e){}
    paint();
    if(typeof window.onThemeChange==='function') window.onThemeChange();
  });
  paint();
})();
</script>
<script>
// Charts read colours at draw time, so redraw them in the new theme.
window.onThemeChange=function(){
  if(cardsData.length) drawPortfolioChart(cardsData);
  if(openCardId){
    var card=cardsData.find(function(c){return c.id===openCardId;});
    if(card) drawModalChart(card);
  }
};
</script>
